<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="auth.js"></script>
<title>Locations</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

<style>
body { font-family: "Times New Roman", serif; background:#fafafa; }
.container { width: 720px; margin: 40px auto; background:#fff; padding:20px; border:1px solid #000; }
h2 { text-align: center; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.form-grid .full { grid-column: 1 / -1; }
label { display: block; margin-top: 12px; font-size: 14px; }
input, select, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; font-family: inherit; }
textarea { resize: vertical; min-height: 50px; }
.checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
.checkbox-row input { width: auto; margin: 0; }
.checkbox-row label { margin: 0; }
button { margin-top: 15px; padding: 6px 14px; cursor: pointer; }
.btn-row { text-align: right; }
.btn-row button { margin-left: 8px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid black; padding: 6px; font-size: 13px; }
th { background: #f2f2f2; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: #f0f0f0; }
tr.inactive-row { color: #999; }
.badge { display: inline-block; padding: 1px 7px; font-size: 11px; border: 1px solid #000; }
.badge.active { background: #eaffea; }
.badge.inactive { background: #f2f2f2; color: #999; border-color: #999; }
#formTitle { margin-top: 0; }
#statusMsg { margin-top: 10px; font-size: 13px; color: #a00; }
#searchBox { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
.hint { font-size: 11.5px; color: #666; margin-top: 3px; }
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<div class="container">
  <h2 id="formTitle">Add Location</h2>

  <div class="form-grid">
    <label class="full">
      Location Name *
      <input type="text" id="locationName" autocomplete="off" placeholder="e.g. RM Store, Shop Floor, QC Hold">
    </label>

    <label class="full">
      Type
      <select id="locationType">
        <option value="STORE">Store</option>
        <option value="SHOP_FLOOR">Shop Floor</option>
        <option value="QC">QC</option>
        <option value="OTHER">Other</option>
      </select>
      <div class="hint">Used to group locations in dropdowns elsewhere — doesn't change how stock is tracked.</div>
    </label>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="locationActive" checked>
    <label for="locationActive">Active (available for new stock transactions)</label>
  </div>

  <div id="statusMsg"></div>

  <div class="btn-row">
    <button id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">Cancel Edit</button>
    <button id="saveBtn" onclick="saveLocation()">Save Location</button>
  </div>

  <hr style="margin-top:25px;">

  <label>
    Search Locations
    <input type="text" id="searchBox" placeholder="Type a name to filter…">
  </label>

  <table id="locationsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const LOCATION_TYPE_LABELS = {
  STORE: "Store",
  SHOP_FLOOR: "Shop Floor",
  QC: "QC",
  OTHER: "Other"
};

let allLocations = [];
let editingId = null;

/* ---------------- LOAD LOCATIONS ---------------- */
async function loadLocations() {
  try {
    const res = await fetch(API_BASE_URL + "/locations");
    if (!res.ok) throw new Error("HTTP " + res.status);
    allLocations = await res.json();
    renderTable(allLocations);
  } catch (err) {
    console.error("LOCATION LOAD ERROR:", err);
    document.querySelector("#locationsTable tbody").innerHTML =
      `<tr><td colspan="3">Failed to load locations</td></tr>`;
  }
}

function renderTable(rows) {
  const tbody = document.querySelector("#locationsTable tbody");
  tbody.innerHTML = "";

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="3">No locations yet</td></tr>`;
    return;
  }

  // Active locations first, then alphabetical within each group — matches
  // what a user scanning this list actually cares about (the ones they can
  // still pick for a new transaction).
  const sorted = [...rows].sort((a, b) => {
    if (a.is_active !== b.is_active) return b.is_active - a.is_active;
    return a.location_name.localeCompare(b.location_name);
  });

  sorted.forEach(l => {
    const tr = document.createElement("tr");
    tr.className = "clickable" + (l.is_active ? "" : " inactive-row");
    tr.innerHTML = `
      <td>${l.location_name}</td>
      <td>${LOCATION_TYPE_LABELS[l.location_type] || l.location_type}</td>
      <td><span class="badge ${l.is_active ? "active" : "inactive"}">${l.is_active ? "Active" : "Inactive"}</span></td>
    `;
    tr.onclick = () => startEdit(l);
    tbody.appendChild(tr);
  });
}

/* ---------------- SEARCH / FILTER ---------------- */
document.getElementById("searchBox").addEventListener("input", () => {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  if (!q) return renderTable(allLocations);
  renderTable(allLocations.filter(l => l.location_name.toLowerCase().includes(q)));
});

/* ---------------- EDIT MODE ---------------- */
function startEdit(l) {
  editingId = l.id;
  document.getElementById("formTitle").textContent = "Edit Location";
  document.getElementById("locationName").value = l.location_name || "";
  document.getElementById("locationType").value = l.location_type || "STORE";
  document.getElementById("locationActive").checked = !!l.is_active;
  document.getElementById("saveBtn").textContent = "Update Location";
  document.getElementById("cancelEditBtn").style.display = "inline-block";
  document.getElementById("statusMsg").textContent = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelEdit() {
  editingId = null;
  document.getElementById("formTitle").textContent = "Add Location";
  document.getElementById("locationName").value = "";
  document.getElementById("locationType").value = "STORE";
  document.getElementById("locationActive").checked = true;
  document.getElementById("saveBtn").textContent = "Save Location";
  document.getElementById("cancelEditBtn").style.display = "none";
  document.getElementById("statusMsg").textContent = "";
}

/* ---------------- SAVE / UPDATE ---------------- */
async function saveLocation() {
  const payload = {
    location_name: document.getElementById("locationName").value.trim(),
    location_type: document.getElementById("locationType").value,
    is_active: document.getElementById("locationActive").checked
  };

  if (!payload.location_name) {
    document.getElementById("statusMsg").textContent = "Location name is required";
    return;
  }

  const url = editingId
    ? API_BASE_URL + "/locations/" + editingId
    : API_BASE_URL + "/locations/create";
  const method = editingId ? "PUT" : "POST";

  try {
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Save failed");

    cancelEdit();
    loadLocations();
  } catch (err) {
    console.error("SAVE LOCATION ERROR:", err);
    document.getElementById("statusMsg").textContent = err.message;
  }
}

/* ---------------- INIT ---------------- */
window.addEventListener("DOMContentLoaded", loadLocations);
</script>

</body>
</html>
