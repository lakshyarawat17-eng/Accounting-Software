<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="auth.js"></script>
<title>Stock Transfer Register</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.back-link {
  display: inline-block;
  margin-bottom: 10px;
}

.top-actions {
  text-align: right;
  margin-bottom: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

.empty {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<a class="back-link" href="Main Menu.html">⬅ Main Menu</a>
<div class="title">Stock Transfer Register</div>

<div class="top-actions">
  <a href="Stock Transfer.html"><button>🔁 New Stock Transfer</button></a>
</div>

<table id="transferTable">
  <tr>
    <th>Transfer No</th>
    <th>Date</th>
    <th>Item</th>
    <th>Qty</th>
    <th>From</th>
    <th>To</th>
    <th>Rate</th>
    <th>Narration</th>
  </tr>
</table>
<div id="emptyMsg" class="empty" style="display:none;">No stock transfers yet.</div>

<script>
async function loadTransfers() {
  const res = await fetch(API_BASE_URL + "/stock-transfer/list");
  const list = await res.json();

  const table = document.getElementById("transferTable");
  const emptyMsg = document.getElementById("emptyMsg");

  table.innerHTML = `
    <tr>
      <th>Transfer No</th>
      <th>Date</th>
      <th>Item</th>
      <th>Qty</th>
      <th>From</th>
      <th>To</th>
      <th>Rate</th>
      <th>Narration</th>
    </tr>
  `;

  if (!list.length) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  list.forEach(t => {
    const row = table.insertRow();
    row.innerHTML = `
      <td>${t.transfer_no}</td>
      <td class="center">${t.date}</td>
      <td>${t.item_name || ""}</td>
      <td class="center">${t.qty}</td>
      <td>${t.from_location_name || ""}</td>
      <td>${t.to_location_name || ""}</td>
      <td class="amount">${t.rate != null ? Number(t.rate).toFixed(2) : ""}</td>
      <td>${t.narration || ""}</td>
    `;
  });
}

loadTransfers();
</script>

</body>
</html>
