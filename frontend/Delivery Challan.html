<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="auth.js"></script>
<title>Delivery Challan</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.back-link {
  display: inline-block;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

label {
  margin-right: 15px;
}

input, select {
  padding: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

.qty-input {
  width: 80px;
}

.empty {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<a class="back-link" href="Sales Order Register.html">⬅ Sales Order Register</a>
<div class="title">Delivery Challan</div>

<!-- SO PICKER (shown when no so_id in URL) -->
<div class="section-box" id="pickerBox" style="display:none;">
  <div class="section-title">Select Sales Order</div>
  <select id="soPicker" style="width:400px;"></select>
  <button onclick="loadSelectedSO()">Load</button>
</div>

<!-- SO HEADER -->
<div class="section-box" id="headerBox" style="display:none;">
  <div class="section-title">Order Details</div>
  <label>SO No: <b id="soNoLabel"></b></label>
  <label>Customer: <b id="customerLabel"></b></label>
  <label>Order Date: <b id="soDateLabel"></b></label>
  <br><br>
  <label>Challan Date:
    <input type="date" id="dcDate">
  </label>
  <label>Issue From:
    <select id="issueLocation"></select>
  </label>
  <label style="margin-right:0;">Narration:
    <input type="text" id="narration" placeholder="Optional note" style="width:300px;">
  </label>
</div>

<!-- ITEMS -->
<div class="section-box" id="itemsBox" style="display:none;">
  <div class="section-title">Items Pending Delivery</div>

  <table id="itemsTable">
    <tr>
      <th>Item</th>
      <th>Ordered</th>
      <th>Already Delivered</th>
      <th>Pending</th>
      <th>Deliver Now</th>
    </tr>
  </table>

  <div style="margin-top:12px;">
    <button onclick="submitChallan()">✅ Confirm Delivery</button>
  </div>
</div>

<div id="emptyMsg" class="empty" style="display:none;"></div>

<script>
let currentSO = null;

const params = new URLSearchParams(window.location.search);
const soIdFromUrl = params.get("so_id");

// Locations dropdown for the "issue from" location — mirrors the pattern
// in Item Wise Report.html. Defaults to "FG Store" to match the backend's
// own default (resolveLocationId fallback in /dc/save), so a challan saved
// without ever touching the dropdown still leaves stock from the same
// place it did before this control existed.
async function loadLocations() {
  const res = await fetch(API_BASE_URL + "/locations?active=1");
  const locations = await res.json();

  const select = document.getElementById("issueLocation");
  select.innerHTML = locations.map(l => `<option value="${l.id}">${l.location_name}</option>`).join("");

  const fgStore = locations.find(l => l.location_name === "FG Store");
  if (fgStore) select.value = fgStore.id;
}

window.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("dcDate").value = new Date().toISOString().slice(0, 10);
  await loadLocations();

  if (soIdFromUrl) {
    loadSO(soIdFromUrl);
  } else {
    await populatePicker();
  }
});

async function populatePicker() {
  const res = await fetch(API_BASE_URL + "/so/list");
  const list = await res.json();
  const deliverable = list.filter(so => ["OPEN", "PARTIALLY_DELIVERED"].includes(so.status));

  if (!deliverable.length) {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = "No sales orders are pending delivery.";
    return;
  }

  const picker = document.getElementById("soPicker");
  picker.innerHTML = deliverable
    .map(so => `<option value="${so.id}">${so.so_no} — ${so.customer} (₹${so.grand_total.toFixed(2)})</option>`)
    .join("");

  document.getElementById("pickerBox").style.display = "block";
}

function loadSelectedSO() {
  const id = document.getElementById("soPicker").value;
  loadSO(id);
}

async function loadSO(id) {
  const res = await fetch(API_BASE_URL + `/so/${id}`);
  const so = await res.json();

  if (so.error) {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = so.error;
    return;
  }

  if (so.status === "CANCELLED") {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = "This sales order has been cancelled.";
    return;
  }

  currentSO = so;

  document.getElementById("pickerBox").style.display = "none";
  document.getElementById("headerBox").style.display = "block";
  document.getElementById("itemsBox").style.display = "block";

  document.getElementById("soNoLabel").textContent = so.so_no;
  document.getElementById("customerLabel").textContent = so.customer;
  document.getElementById("soDateLabel").textContent = so.date;

  renderItems();
}

function renderItems() {
  const table = document.getElementById("itemsTable");
  table.innerHTML = `
    <tr>
      <th>Item</th>
      <th>Ordered</th>
      <th>Already Delivered</th>
      <th>Pending</th>
      <th>Deliver Now</th>
    </tr>
  `;

  currentSO.items.forEach(item => {
    const pending = item.qty - item.delivered_qty;
    const row = table.insertRow();
    row.innerHTML = `
      <td>${item.item_name}</td>
      <td class="center">${item.qty}</td>
      <td class="center">${item.delivered_qty}</td>
      <td class="center">${pending}</td>
      <td class="center">
        <input type="number" class="qty-input" data-so-item-id="${item.id}"
               data-pending="${pending}" min="0" max="${pending}"
               step="any" value="${pending > 0 ? pending : 0}" ${pending <= 0 ? "disabled" : ""}>
      </td>
    `;
  });
}

function submitChallan() {
  const date = document.getElementById("dcDate").value;
  if (!date) {
    alert("Challan date required");
    return;
  }

  const inputs = document.querySelectorAll("#itemsTable input.qty-input");
  const items = [];

  for (const input of inputs) {
    const qty = Number(input.value) || 0;
    const pending = Number(input.dataset.pending);

    if (qty < 0 || qty > pending + 1e-6) {
      alert("Delivery quantity cannot exceed the pending quantity");
      return;
    }
    if (qty > 0) {
      items.push({ so_item_id: Number(input.dataset.soItemId), qty });
    }
  }

  if (!items.length) {
    alert("Enter at least one quantity to deliver");
    return;
  }

  const locationId = document.getElementById("issueLocation").value;

  fetch(API_BASE_URL + "/dc/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      so_id: currentSO.id,
      date,
      customer: currentSO.customer,
      narration: document.getElementById("narration").value.trim() || null,
      items,
      location_id: locationId || null
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }
    alert(`Delivery Challan ${data.dc_no} recorded successfully`);
    window.location.href = "Sales Order Register.html";
  })
  .catch(() => alert("Error recording delivery challan"));
}
</script>

</body>
</html>
