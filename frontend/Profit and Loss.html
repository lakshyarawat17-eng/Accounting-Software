<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Profit & Loss Account</title>
<style>
body { font-family: "Times New Roman", serif; }
h2 { text-align:center; }
.filter { text-align:center; margin-bottom:10px; }
table { width:100%; border-collapse:collapse; }
th, td { border:1px solid black; padding:6px; }
.amount { text-align:right; }
</style>
</head>
<body>

<h2>Profit & Loss Account</h2>

<div class="filter">
  <label>From: <input type="date" id="fromDate"></label>
  &nbsp;&nbsp;
  <label>To: <input type="date" id="toDate"></label>
  &nbsp;&nbsp;
  <button onclick="loadPL()">Apply</button>
</div>

<table id="plTable">
<tr>
  <th colspan="2">Expenses</th>
  <th colspan="2">Income</th>
</tr>
<tr>
  <th>Ledger</th><th>Amount</th>
  <th>Ledger</th><th>Amount</th>
</tr>
</table>

<script>
function parseDate(d) {
  if (!d) return null;
  if (d.includes("-")) {
    const p = d.split("-");
    return p[0].length === 4 ? new Date(d) : new Date(`${p[2]}-${p[1]}-${p[0]}`);
  }
  return null;
}

function loadPL() {
  Promise.all([
    fetch(API_BASE_URL + "/ledger/all").then(r => r.json()),
    fetch(API_BASE_URL + "/ledger/master").then(r => r.json())
  ]).then(([entries, masters]) => {

    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;
    const fDate = from ? new Date(from) : null;
    const tDate = to ? new Date(to) : null;

    /* DATE FILTER */
    const filteredEntries = entries.filter(e => {
      const ed = parseDate(e.date);
      if (!ed) return false;
      if (fDate && ed < fDate) return false;
      if (tDate && ed > tDate) return false;
      return true;
    });

    /* LEDGER → NATURE MAP */
    const groupMap = {};
    masters.forEach(m => groupMap[m.ledger] = m.nature);

    const expenses = {};
    const income = {};

    /* ACCOUNTING LOGIC */
    filteredEntries.forEach(e => {
      const nature = groupMap[e.ledger];

      if (nature === "EXPENSE") {
        const amt = e.debit - e.credit;
        if (amt !== 0)
          expenses[e.ledger] = (expenses[e.ledger] || 0) + amt;
      }

      if (nature === "INCOME") {
        const amt = e.credit - e.debit;
        if (amt !== 0)
          income[e.ledger] = (income[e.ledger] || 0) + amt;
      }
    });

    /* CLEAR OLD ROWS */
    const table = document.getElementById("plTable");
    while (table.rows.length > 2) table.deleteRow(2);

    const expKeys = Object.keys(expenses);
    const incKeys = Object.keys(income);
    const max = Math.max(expKeys.length, incKeys.length);

    let totalExp = 0, totalInc = 0;

    /* RENDER ROWS */
    for (let i = 0; i < max; i++) {
      const r = table.insertRow();

      if (expKeys[i]) {
        const v = expenses[expKeys[i]];
        totalExp += v;
        r.innerHTML += `<td>${expKeys[i]}</td><td class="amount">${v.toFixed(2)}</td>`;
      } else {
        r.innerHTML += "<td></td><td></td>";
      }

      if (incKeys[i]) {
        const v = income[incKeys[i]];
        totalInc += v;
        r.innerHTML += `<td>${incKeys[i]}</td><td class="amount">${v.toFixed(2)}</td>`;
      } else {
        r.innerHTML += "<td></td><td></td>";
      }
    }

    /* PROFIT / LOSS */
    const profit = totalInc - totalExp;
    const balRow = table.insertRow();

    if (profit > 0) {
      balRow.innerHTML = `
        <td><strong>Net Profit</strong></td>
        <td class="amount"><strong>${profit.toFixed(2)}</strong></td>
        <td></td><td></td>
      `;
      totalExp += profit;
    } else if (profit < 0) {
      balRow.innerHTML = `
        <td></td><td></td>
        <td><strong>Net Loss</strong></td>
        <td class="amount"><strong>${Math.abs(profit).toFixed(2)}</strong></td>
      `;
      totalInc += Math.abs(profit);
    }

    /* TOTALS */
    const tot = table.insertRow();
    tot.innerHTML = `
      <td><strong>Total</strong></td>
      <td class="amount"><strong>${totalExp.toFixed(2)}</strong></td>
      <td><strong>Total</strong></td>
      <td class="amount"><strong>${totalInc.toFixed(2)}</strong></td>
    `;
  });
}

loadPL();
</script>

</body>
</html>
