<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="auth.js"></script>
<title>Outstanding & Ageing</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

.type-toggle {
  display: flex;
  gap: 0;
  margin-bottom: 12px;
}
.type-toggle button {
  flex: 1;
  padding: 10px;
  font-size: 15px;
  font-weight: bold;
  border: 1px solid black;
  background: white;
  cursor: pointer;
}
.type-toggle button.active {
  background: #333;
  color: white;
}
.type-toggle button:first-child { border-right: none; }

.party-row {
  cursor: pointer;
  background: #fafafa;
}
.party-row:hover {
  background: #eee;
}
.detail-row td {
  padding: 0;
}
.detail-row table {
  margin: 0;
}
.detail-row th {
  background: #fff8e1;
  font-size: 12px;
}

.bucket-0-30 { color: #2e7d32; }
.bucket-31-60 { color: #f9a825; }
.bucket-61-90 { color: #ef6c00; }
.bucket-90 { color: #c62828; font-weight: bold; }

.empty-msg {
  color: #666;
  font-style: italic;
  padding: 10px;
}

.grand-total {
  text-align: right;
  font-weight: bold;
  font-size: 15px;
  margin-top: 10px;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<div class="title">Outstanding & Ageing Report</div>

<div class="type-toggle">
  <button id="btnReceivable" class="active" onclick="setType('receivable')">Receivables (Customers owe us)</button>
  <button id="btnPayable" onclick="setType('payable')">Payables (We owe Suppliers)</button>
</div>

<div class="section-box">
  <div class="section-title" id="reportTitle">Receivables Ageing</div>
  <div id="reportArea"><div class="empty-msg">Loading...</div></div>
  <div class="grand-total" id="grandTotal"></div>
</div>

<script>
let currentType = "receivable";

window.addEventListener("DOMContentLoaded", () => loadReport());

function setType(type) {
  currentType = type;
  document.getElementById("btnReceivable").classList.toggle("active", type === "receivable");
  document.getElementById("btnPayable").classList.toggle("active", type === "payable");
  document.getElementById("reportTitle").textContent =
    type === "receivable" ? "Receivables Ageing" : "Payables Ageing";
  loadReport();
}

function bucketClass(bucket) {
  if (bucket === "0-30") return "bucket-0-30";
  if (bucket === "31-60") return "bucket-31-60";
  if (bucket === "61-90") return "bucket-61-90";
  return "bucket-90";
}

async function loadReport() {
  const area = document.getElementById("reportArea");
  area.innerHTML = `<div class="empty-msg">Loading...</div>`;

  try {
    const res = await fetch(API_BASE_URL + `/report/ageing?type=${currentType}`);
    const parties = await res.json();

    if (!parties.length) {
      area.innerHTML = `<div class="empty-msg">Nothing outstanding — all ${currentType === "receivable" ? "customers" : "suppliers"} are settled up.</div>`;
      document.getElementById("grandTotal").textContent = "";
      return;
    }

    const table = document.createElement("table");
    table.innerHTML = `
      <tr>
        <th></th>
        <th>${currentType === "receivable" ? "Customer" : "Supplier"}</th>
        <th>0-30 days</th>
        <th>31-60 days</th>
        <th>61-90 days</th>
        <th>90+ days</th>
        <th>Total Due</th>
      </tr>
    `;

    let grandTotal = 0;

    parties.forEach((p, idx) => {
      grandTotal += p.total;

      const row = table.insertRow();
      row.className = "party-row";
      row.innerHTML = `
        <td class="center">▸</td>
        <td>${p.party}</td>
        <td class="amount">${p.buckets["0-30"] ? p.buckets["0-30"].toFixed(2) : "-"}</td>
        <td class="amount">${p.buckets["31-60"] ? p.buckets["31-60"].toFixed(2) : "-"}</td>
        <td class="amount">${p.buckets["61-90"] ? p.buckets["61-90"].toFixed(2) : "-"}</td>
        <td class="amount ${p.buckets["90+"] > 0 ? "bucket-90" : ""}">${p.buckets["90+"] ? p.buckets["90+"].toFixed(2) : "-"}</td>
        <td class="amount"><b>${p.total.toFixed(2)}</b></td>
      `;

      const detailRow = table.insertRow();
      detailRow.className = "detail-row";
      detailRow.style.display = "none";
      const detailCell = detailRow.insertCell();
      detailCell.colSpan = 7;
      detailCell.innerHTML = `
        <table>
          <tr><th>Invoice No</th><th>Date</th><th>Invoice Total</th><th>Balance Due</th><th>Bucket</th></tr>
          ${p.invoices.map(inv => `
            <tr>
              <td>${inv.invoice_no}</td>
              <td class="center">${inv.date}</td>
              <td class="amount">${inv.total_amount.toFixed(2)}</td>
              <td class="amount">${inv.balance.toFixed(2)}</td>
              <td class="center ${bucketClass(inv.bucket)}">${inv.bucket}</td>
            </tr>
          `).join("")}
        </table>
      `;

      row.onclick = () => {
        const showing = detailRow.style.display !== "none";
        detailRow.style.display = showing ? "none" : "table-row";
        row.cells[0].textContent = showing ? "▸" : "▾";
      };
    });

    area.innerHTML = "";
    area.appendChild(table);
    document.getElementById("grandTotal").textContent = `Total Outstanding: ₹${grandTotal.toFixed(2)}`;

  } catch (e) {
    area.innerHTML = `<div class="empty-msg">Could not load report.</div>`;
  }
}
</script>

</body>
</html>
