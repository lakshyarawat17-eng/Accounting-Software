<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Purchase Book</title>

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

label {
  margin-right: 15px;
}

input, select {
  padding: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

#suggestions {
  border: 1px solid #aaa;
  max-height: 150px;
  overflow-y: auto;
  position: absolute;
  background: white;
  z-index: 10;
}
#suggestions div:hover {
  background: #eee;
}

.totals-box {
  margin-top: 10px;
  text-align: right;
}
.totals-box div {
  margin: 2px 0;
}
.totals-box .grand {
  font-weight: bold;
  font-size: 15px;
}
</style>
</head>

<body>

<div class="title">Purchase Book</div>

<div class="section-box" id="poBanner" style="display:none; background:#eef6ff;">
  📦 Invoicing against Purchase Order <b id="poBannerNo"></b> — items below were pulled in from goods already received against it.
</div>

<!-- 1️⃣ PURCHASE HEADER -->
<div class="section-box">
  <div class="section-title">Purchase Details</div>

  <label>Date:
    <input type="date" id="purchaseDate">
  </label>

  <label>Supplier:
    <input type="text" id="supplier" placeholder="Supplier Name">
  </label>

  <label>Invoice No:
    <input type="text" id="invoiceNo" placeholder="PINV-0001">
  </label>

  <label>Purchase Type:
    <select id="taxType">
      <option value="INTRA">Same State (CGST + SGST)</option>
      <option value="INTER">Different State (IGST)</option>
    </select>
  </label>
</div>

<!-- 2️⃣ ADD ITEM -->
<div class="section-box" id="addItemBox">
  <div class="section-title">Add Item</div>

  <label>Item:
    <input type="text" id="itemSearch" placeholder="Search item">
    <div id="suggestions"></div>
  </label>

  <label>Qty:
    <input type="number" id="itemQty" value="1">
  </label>

  <label>Rate ₹:
    <input type="number" id="itemRate" step="0.01">
  </label>

  <label>GST Rate:
    <select id="itemGstRate">
      <option value="0">0%</option>
      <option value="0.25">0.25%</option>
      <option value="3">3%</option>
      <option value="5">5%</option>
      <option value="12">12%</option>
      <option value="18" selected>18%</option>
      <option value="28">28%</option>
    </select>
  </label>

  <button onclick="addItem()">Add Item</button>
</div>

<!-- 3️⃣ ITEMS LIST -->
<div class="section-box">
  <div class="section-title">Items</div>

  <table id="itemsTable">
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Rate</th>
      <th>Amount</th>
      <th>GST %</th>
      <th>GST Amt</th>
      <th>Total</th>
    </tr>
  </table>

  <div class="totals-box" id="totalsBox"></div>
</div>

<!-- 4️⃣ SAVE -->
<div class="section-box">
  <button onclick="savePurchase()">Save Purchase</button>
</div>

<script>
let items = [];
let selectedItem = null;
let linkedPoId = null;

const itemSearch = document.getElementById("itemSearch");
const suggestionsBox = document.getElementById("suggestions");
const itemGstRate = document.getElementById("itemGstRate");
const taxTypeSelect = document.getElementById("taxType");
const supplierInput = document.getElementById("supplier");
const invoiceNoInput = document.getElementById("invoiceNo");

/* If arriving from the Purchase Order Register with ?po_id=, pull in the
   pending (received-but-not-yet-invoiced) items from that PO instead of
   starting blank. Otherwise behave exactly like a normal direct purchase. */
window.addEventListener("DOMContentLoaded", async () => {
  const params = new URLSearchParams(window.location.search);
  const poId = params.get("po_id");

  // Prefill the next purchase invoice number either way — convenience only,
  // still editable.
  try {
    const invRes = await fetch(API_BASE_URL + "/purchase/next-invoice");
    const invData = await invRes.json();
    if (invData.invoiceNo) invoiceNoInput.value = invData.invoiceNo;
  } catch (e) {
    // Non-fatal — user can type the invoice number manually.
  }

  if (!poId) return;

  const res = await fetch(API_BASE_URL + `/po/${poId}`);
  const po = await res.json();
  if (po.error) {
    alert(po.error);
    return;
  }

  linkedPoId = po.id;

  document.getElementById("poBanner").style.display = "block";
  document.getElementById("poBannerNo").textContent = po.po_no;
  document.getElementById("addItemBox").style.display = "none";

  supplierInput.value = po.supplier;
  supplierInput.readOnly = true;
  taxTypeSelect.value = po.tax_type || "INTRA";
  taxTypeSelect.disabled = true;

  const pending = po.items.filter(i => i.qty - i.invoiced_qty > 1e-6);
  if (!pending.length) {
    alert("Everything on this purchase order has already been invoiced.");
  }

  pending.forEach(i => {
    const qty = i.qty - i.invoiced_qty;
    const amount = qty * i.rate;
    const gstAmount = amount * (i.gst_rate / 100);
    items.push({
      item_id: i.item_id,
      po_item_id: i.id,
      item_name: i.item_name,
      qty,
      rate: i.rate,
      amount,
      gst_rate: i.gst_rate,
      gst_amount: gstAmount
    });
  });

  renderPoItems();
});

/* Renders items pulled in from a PO (read-only rows, no manual add/remove
   since the quantities must reconcile back to what was received). */
function renderPoItems() {
  itemsTable.innerHTML = `
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Rate</th>
      <th>Amount</th>
      <th>GST %</th>
      <th>GST Amt</th>
      <th>Total</th>
    </tr>
  `;

  items.forEach(item => {
    const row = itemsTable.insertRow();
    row.innerHTML = `
      <td>${item.item_name}</td>
      <td class="center">${item.qty}</td>
      <td class="amount">${item.rate.toFixed(2)}</td>
      <td class="amount">${item.amount.toFixed(2)}</td>
      <td class="center">${item.gst_rate}%</td>
      <td class="amount">${item.gst_amount.toFixed(2)}</td>
      <td class="amount">${(item.amount + item.gst_amount).toFixed(2)}</td>
    `;
  });

  renderTotals();
}

/* 🔍 ITEM AUTOCOMPLETE */
itemSearch.addEventListener("input", async () => {
  selectedItem = null;
  const q = itemSearch.value.trim();

  if (q.length < 2) {
    suggestionsBox.innerHTML = "";
    return;
  }

  const res = await fetch(API_BASE_URL + `/items/search?q=${q}`);
  const list = await res.json();

  suggestionsBox.innerHTML = "";
  list.forEach(item => {
    const div = document.createElement("div");
    div.textContent = `${item.item_name} (₹${item.selling_price})`;
    div.style.padding = "4px";
    div.style.cursor = "pointer";

    div.onclick = () => {
      selectedItem = item;
      itemSearch.value = item.item_name;
      itemRate.value = item.selling_price || "";
      // Pre-fill the GST rate from the item's master record, if it has one
      if (item.gst_rate !== null && item.gst_rate !== undefined) {
        const match = [...itemGstRate.options].find(
          o => Number(o.value) === Number(item.gst_rate)
        );
        if (match) itemGstRate.value = match.value;
      }
      suggestionsBox.innerHTML = "";
    };

    suggestionsBox.appendChild(div);
  });
});

/* ➕ ADD ITEM */
function addItem() {
  const name = itemSearch.value.trim();
  const qty = Number(itemQty.value);
  const rate = Number(itemRate.value);
  const gstRate = Number(itemGstRate.value);

  if (!name) {
    alert("Item name required");
    return;
  }
  if (qty <= 0 || rate <= 0) {
    alert("Invalid qty or rate");
    return;
  }

  const amount = qty * rate;
  const gstAmount = amount * (gstRate / 100);

  items.push({
    item_id: selectedItem ? selectedItem.id : null,
    item_name: name,
    qty,
    rate,
    amount,
    gst_rate: gstRate,
    gst_amount: gstAmount
  });

  const row = itemsTable.insertRow();
  row.innerHTML = `
    <td>${name}</td>
    <td class="center">${qty}</td>
    <td class="amount">${rate.toFixed(2)}</td>
    <td class="amount">${amount.toFixed(2)}</td>
    <td class="center">${gstRate}%</td>
    <td class="amount">${gstAmount.toFixed(2)}</td>
    <td class="amount">${(amount + gstAmount).toFixed(2)}</td>
  `;

  selectedItem = null;
  itemSearch.value = "";
  itemQty.value = 1;
  itemRate.value = "";
  itemGstRate.value = "18";

  renderTotals();
}

/* 🧮 RUNNING TOTALS (taxable / CGST / SGST / IGST / grand total) */
function renderTotals() {
  const totalsBox = document.getElementById("totalsBox");

  if (items.length === 0) {
    totalsBox.innerHTML = "";
    return;
  }

  const taxable = items.reduce((s, i) => s + i.amount, 0);
  const totalGst = items.reduce((s, i) => s + i.gst_amount, 0);
  const isInter = taxTypeSelect.value === "INTER";

  const igst = isInter ? totalGst : 0;
  const cgst = isInter ? 0 : totalGst / 2;
  const sgst = isInter ? 0 : totalGst / 2;
  const grandTotal = taxable + totalGst;

  totalsBox.innerHTML = `
    <div>Taxable Amount: ₹${taxable.toFixed(2)}</div>
    ${isInter
      ? `<div>IGST: ₹${igst.toFixed(2)}</div>`
      : `<div>CGST: ₹${cgst.toFixed(2)}</div><div>SGST: ₹${sgst.toFixed(2)}</div>`
    }
    <div class="grand">Grand Total: ₹${grandTotal.toFixed(2)}</div>
  `;
}

taxTypeSelect.addEventListener("change", renderTotals);

/* 💾 SAVE PURCHASE */
function savePurchase() {
  const date = purchaseDate.value;
  const supplierEl = document.getElementById("supplier");
  const supplier = supplierEl.value.trim();
  const invoiceNoEl = document.getElementById("invoiceNo");
  const invoiceNo = invoiceNoEl.value.trim();
  const taxType = taxTypeSelect.value;

  if (!date || !supplier || !invoiceNo) {
    alert("Date, supplier and invoice no required");
    return;
  }

  if (items.length === 0) {
    alert("Add at least one item");
    return;
  }

  fetch(API_BASE_URL + "/purchase/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      date,
      supplier,
      invoiceNo,
      taxType,
      po_id: linkedPoId,
      items
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }

    alert("Purchase saved successfully");

    if (linkedPoId) {
      // This invoice was tied to a PO — head back to the register so the
      // user can see its updated status rather than resetting this form.
      window.location.href = "Purchase Order Register.html";
      return;
    }

    // reset (only relevant for direct, non-PO purchases)
    items = [];
    itemsTable.innerHTML = `
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>Amount</th>
        <th>GST %</th>
        <th>GST Amt</th>
        <th>Total</th>
      </tr>
    `;
    purchaseDate.value = "";
    supplierEl.value = "";
    invoiceNoEl.value = "";
    taxTypeSelect.value = "INTRA";
    renderTotals();
  })
  .catch(() => alert("Error saving purchase"));
}
</script>

</body>
</html>
