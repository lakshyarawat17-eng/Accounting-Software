<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Attendance</title>
<style>
body { font-family: "Times New Roman", serif; background:#fafafa; }
.container { width: 820px; max-width: 96%; margin: 40px auto; background:#fff; padding:20px; border:1px solid #000; }
h2 { text-align: center; margin-top: 0; }
.top-links { text-align:right; font-size:12px; margin-bottom:8px; }
.picker { text-align:center; margin-bottom: 14px; }
.picker select, .picker button { padding: 6px 10px; font-size: 13px; margin: 0 4px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid black; padding: 5px 6px; font-size: 12.5px; }
th { background: #f2f2f2; }
td input { width: 70px; }
.btn-row { text-align: right; margin-top: 12px; }
#statusMsg { margin-top: 10px; font-size: 13px; }
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>
<body>
<div class="container">
  <div class="top-links"><a href="Main Menu.html">&larr; Main Menu</a></div>
  <h2>Monthly Attendance (LOP Days)</h2>

  <div class="picker">
    Month:
    <select id="month"></select>
    Year:
    <select id="year"></select>
    <button onclick="loadAttendance()">Load</button>
  </div>

  <table>
    <thead><tr><th>Code</th><th>Name</th><th>Days in Month</th><th>LOP Days</th><th>Remarks</th></tr></thead>
    <tbody id="attBody"></tbody>
  </table>

  <div class="btn-row"><button onclick="saveAll()">Save Attendance</button></div>
  <div id="statusMsg"></div>
</div>

<script>
const API = window.API_BASE_URL;
const monthSel = document.getElementById("month");
const yearSel = document.getElementById("year");
const names = ["January","February","March","April","May","June","July","August","September","October","November","December"];
names.forEach((n,i) => { const o = document.createElement("option"); o.value = i+1; o.textContent = n; monthSel.appendChild(o); });
const now = new Date();
monthSel.value = now.getMonth() + 1;
for (let y = now.getFullYear() - 2; y <= now.getFullYear() + 1; y++) {
  const o = document.createElement("option"); o.value = y; o.textContent = y; yearSel.appendChild(o);
}
yearSel.value = now.getFullYear();

async function loadAttendance() {
  const month = monthSel.value, year = yearSel.value;
  const res = await fetch(`${API}/hr/attendance/${year}/${month}`);
  const rows = await res.json();
  const body = document.getElementById("attBody");
  body.innerHTML = "";
  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.employee_code}</td><td>${r.full_name}</td><td>${r.days_in_month}</td>
      <td><input type="number" min="0" max="${r.days_in_month}" step="0.5" value="${r.lop_days}" data-emp="${r.employee_id}" class="lop"></td>
      <td><input type="text" class="remarks" data-emp="${r.employee_id}"></td>`;
    body.appendChild(tr);
  });
  document.getElementById("statusMsg").textContent = rows.length ? "" : "No active employees found.";
}

async function saveAll() {
  const month = monthSel.value, year = yearSel.value;
  const msg = document.getElementById("statusMsg");
  const inputs = document.querySelectorAll(".lop");
  let errors = 0;
  for (const inp of inputs) {
    const empId = inp.dataset.emp;
    const remarks = document.querySelector(`.remarks[data-emp="${empId}"]`).value;
    const res = await fetch(`${API}/hr/attendance/save`, {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ employeeId: empId, month, year, lopDays: Number(inp.value) || 0, remarks })
    });
    if (!res.ok) errors++;
  }
  msg.style.color = errors ? "#a00" : "#070";
  msg.textContent = errors ? `${errors} row(s) failed to save.` : "Attendance saved for all employees.";
}

loadAttendance();
</script>
</body>
</html>
