<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Payroll Reports</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
<style>
body { font-family: "Times New Roman", serif; background:#fafafa; }
.container { width: 950px; max-width: 97%; margin: 40px auto; background:#fff; padding:20px; border:1px solid #000; }
h2 { text-align: center; margin-top: 0; }
.top-links { text-align:right; font-size:12px; margin-bottom:8px; }
.picker { text-align:center; margin-bottom: 14px; }
.picker select, .picker button { padding: 6px 10px; font-size: 13px; margin: 0 4px; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
th, td { border: 1px solid black; padding: 5px 6px; }
th { background: #f2f2f2; }
.totals-row td { font-weight: bold; background: #fafafa; }
#statusMsg { margin-top: 10px; font-size: 13px; color:#a00; }
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>
<body>
<div class="container">
  <div class="top-links"><a href="Main Menu.html">&larr; Main Menu</a></div>
  <h2>Payroll Reports</h2>

  <div class="picker">
    Report:
    <select id="reportType">
      <option value="salary-register">Salary Register</option>
      <option value="pf-summary">PF Summary</option>
      <option value="esi-summary">ESI Summary</option>
      <option value="pt-summary">Professional Tax Summary</option>
      <option value="tds-summary">TDS Summary</option>
      <option value="loan-outstanding">Loan Outstanding (all periods)</option>
    </select>
    Month:
    <select id="month"></select>
    Year:
    <select id="year"></select>
    <button onclick="loadReport()">Run</button>
  </div>

  <div id="statusMsg"></div>
  <div id="reportArea"></div>
</div>

<script>
const API = window.API_BASE_URL;
const monthSel = document.getElementById("month");
const yearSel = document.getElementById("year");
const names = ["January","February","March","April","May","June","July","August","September","October","November","December"];
names.forEach((n,i) => { const o = document.createElement("option"); o.value = i+1; o.textContent = n; monthSel.appendChild(o); });
const now = new Date();
monthSel.value = now.getMonth() + 1;
for (let y = now.getFullYear() - 2; y <= now.getFullYear() + 1; y++) {
  const o = document.createElement("option"); o.value = y; o.textContent = y; yearSel.appendChild(o);
}
yearSel.value = now.getFullYear();

document.getElementById("reportType").addEventListener("change", () => {
  const isLoan = document.getElementById("reportType").value === "loan-outstanding";
  monthSel.style.display = isLoan ? "none" : "inline-block";
  yearSel.style.display = isLoan ? "none" : "inline-block";
});

async function loadReport() {
  const type = document.getElementById("reportType").value;
  const msg = document.getElementById("statusMsg");
  const area = document.getElementById("reportArea");
  msg.textContent = ""; area.innerHTML = "";

  const url = type === "loan-outstanding"
    ? `${API}/hr/report/loan-outstanding`
    : `${API}/hr/report/${type}?month=${monthSel.value}&year=${yearSel.value}`;

  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) { msg.textContent = data.error || "No data"; return; }

  if (type === "salary-register") {
    area.innerHTML = renderTable(
      ["Code","Name","Dept","Gross","PF(E)","ESI(E)","PT","TDS","Loan","Other Ded.","Net Pay"],
      data.details.map(d => [d.employee_code, d.full_name, d.department||"", money(d.gross_earnings), money(d.pf_employee), money(d.esi_employee), money(d.pt), money(d.tds), money(d.loan_deduction), money(d.other_deductions), money(d.net_pay)])
    );
  } else if (type === "pf-summary") {
    area.innerHTML = renderTable(
      ["Code","Name","UAN","PF Number","PF (Employee)","PF (Employer)"],
      data.rows.map(r => [r.employee_code, r.full_name, r.uan||"", r.pf_number||"", money(r.pf_employee), money(r.pf_employer)]),
      [`Total`, "", "", "", money(data.total.pf_employee), money(data.total.pf_employer)]
    );
  } else if (type === "esi-summary") {
    area.innerHTML = renderTable(
      ["Code","Name","ESI Number","Gross Wages","ESI (Employee)","ESI (Employer)"],
      data.rows.map(r => [r.employee_code, r.full_name, r.esi_number||"", money(r.gross_earnings), money(r.esi_employee), money(r.esi_employer)]),
      [`Total`, "", "", "", money(data.total.esi_employee), money(data.total.esi_employer)]
    );
  } else if (type === "pt-summary") {
    area.innerHTML = renderTable(
      ["Code","Name","State","PT"],
      data.rows.map(r => [r.employee_code, r.full_name, r.pt_state||"", money(r.pt)]),
      [`Total`, "", "", money(data.total)]
    );
  } else if (type === "tds-summary") {
    area.innerHTML = renderTable(
      ["Code","Name","PAN","Gross","TDS","Manually Adjusted?"],
      data.rows.map(r => [r.employee_code, r.full_name, r.pan||"", money(r.gross_earnings), money(r.tds), r.tds_is_override ? "Yes" : "No"]),
      [`Total`, "", "", "", money(data.total), ""]
    );
  } else if (type === "loan-outstanding") {
    area.innerHTML = renderTable(
      ["Code","Name","Type","Principal","EMI","Outstanding"],
      data.map(r => [r.employee_code, r.full_name, r.loan_type, money(r.principal), money(r.emi_amount), money(r.outstanding)])
    );
  }
}

function money(n) { return "₹" + Number(n).toFixed(2); }

function renderTable(headers, rows, totalsRow) {
  let html = "<table><thead><tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr></thead><tbody>";
  if (!rows.length) html += `<tr><td colspan="${headers.length}" style="text-align:center;">No data for this period.</td></tr>`;
  rows.forEach(r => { html += "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>"; });
  if (totalsRow && rows.length) html += `<tr class="totals-row">` + totalsRow.map(c => `<td>${c}</td>`).join("") + `</tr>`;
  html += "</tbody></table>";
  return html;
}
</script>
</body>
</html>
