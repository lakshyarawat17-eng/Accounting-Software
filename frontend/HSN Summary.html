<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>HSN Summary</title>

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

label { margin-right: 15px; }
input, select { padding: 4px; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th { background: #f2f2f2; }

.center { text-align: center; }
.amount { text-align: right; }

.missing-row { background: #fdecec; }
.missing-tag { color: #a60000; font-weight: bold; }

.note {
  font-size: 12px;
  color: #444;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="title">HSN-wise Summary (GSTR-1 Table 12)</div>

<div class="section-box">
  <div class="section-title">Select Month</div>

  <label>Month:
    <input type="month" id="monthPicker">
  </label>

  <button onclick="loadHsnSummary()">Show Summary</button>
</div>

<div class="section-box">
  <div class="section-title">Outward Supplies by HSN (net of Credit Notes)</div>
  <table id="hsnTable">
    <tr>
      <th>HSN/SAC</th>
      <th>Description</th>
      <th>UQC</th>
      <th class="amount">Total Quantity</th>
      <th class="amount">Taxable Value</th>
      <th class="amount">IGST</th>
      <th class="amount">CGST</th>
      <th class="amount">SGST</th>
      <th class="amount">Total Value</th>
    </tr>
  </table>
  <div class="note" id="missingNote" style="display:none;">
    ⚠ Rows marked <span class="missing-tag">MISSING</span> are lines with no HSN code on the item or invoice line —
    fix these in Item Master before filing GSTR-1.
  </div>
</div>

<script>
const monthPicker = document.getElementById("monthPicker");
const hsnTable = document.getElementById("hsnTable");
const missingNote = document.getElementById("missingNote");

(function setDefaultMonth() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  monthPicker.value = `${y}-${m}`;
})();

function fmt(n) {
  const val = Number(n) || 0;
  return (val < 0 ? "(" + Math.abs(val).toFixed(2) + ")" : val.toFixed(2));
}

function loadHsnSummary() {
  const month = monthPicker.value;
  if (!month) {
    alert("Please select a month");
    return;
  }

  fetch(API_BASE_URL + `/report/hsn-summary?month=${month}`)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        alert(data.error);
        return;
      }
      renderTable(data);
    })
    .catch(() => alert("Unable to load HSN summary"));
}

function renderTable(data) {
  hsnTable.innerHTML = `
    <tr>
      <th>HSN/SAC</th>
      <th>Description</th>
      <th>UQC</th>
      <th class="amount">Total Quantity</th>
      <th class="amount">Taxable Value</th>
      <th class="amount">IGST</th>
      <th class="amount">CGST</th>
      <th class="amount">SGST</th>
      <th class="amount">Total Value</th>
    </tr>
  `;

  (data.rows || []).forEach(r => {
    const row = hsnTable.insertRow();
    if (r.missing_hsn) row.className = "missing-row";
    row.innerHTML = `
      <td>${r.missing_hsn ? '<span class="missing-tag">MISSING</span>' : r.hsn}</td>
      <td>${r.description || ""}</td>
      <td class="center">${r.uqc || ""}</td>
      <td class="amount">${fmt(r.total_quantity)}</td>
      <td class="amount">₹${fmt(r.taxable_value)}</td>
      <td class="amount">₹${fmt(r.igst)}</td>
      <td class="amount">₹${fmt(r.cgst)}</td>
      <td class="amount">₹${fmt(r.sgst)}</td>
      <td class="amount">₹${fmt(r.total_value)}</td>
    `;
  });

  const t = data.totals || {};
  const totalRow = hsnTable.insertRow();
  totalRow.style.fontWeight = "bold";
  totalRow.innerHTML = `
    <td colspan="3">Total</td>
    <td class="amount">${fmt(t.total_quantity)}</td>
    <td class="amount">₹${fmt(t.taxable_value)}</td>
    <td class="amount">₹${fmt(t.igst)}</td>
    <td class="amount">₹${fmt(t.cgst)}</td>
    <td class="amount">₹${fmt(t.sgst)}</td>
    <td class="amount">₹${fmt(t.total_value)}</td>
  `;

  missingNote.style.display = data.has_missing_hsn ? "block" : "none";
}

// Auto-load on page open
loadHsnSummary();
</script>

</body>
</html>
