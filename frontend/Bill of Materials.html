<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="auth.js"></script>
<title>Bill of Materials</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

label {
  margin-right: 15px;
}

input, select {
  padding: 4px;
}

input[readonly] {
  background: #eee;
}

input:disabled, select:disabled {
  background: #eee;
  color: #666;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

#suggestions, #componentSuggestions {
  border: 1px solid #aaa;
  max-height: 150px;
  overflow-y: auto;
  position: absolute;
  background: white;
  z-index: 10;
  width: 260px;
}
#suggestions div, #componentSuggestions div {
  padding: 6px;
  cursor: pointer;
}
#suggestions div:hover, #componentSuggestions div:hover {
  background: #eee;
}

.item-wrap {
  position: relative;
  display: inline-block;
}

.back-link {
  display: inline-block;
  margin-bottom: 10px;
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
  color: white;
}
.badge-DRAFT { background: #888; }
.badge-ACTIVE { background: #1a7f37; }
.badge-OBSOLETE { background: #a00; }
.badge-NEW { background: #0969da; }

.readonly-note {
  background: #fff8e1;
  border: 1px solid #d6a300;
  padding: 8px 10px;
  margin-bottom: 12px;
  font-size: 13px;
}

.save-actions button {
  padding: 6px 14px;
  cursor: pointer;
  margin-right: 8px;
}

.totals-box {
  margin-top: 10px;
  text-align: right;
}
.totals-box .grand {
  font-weight: bold;
  font-size: 15px;
}

.error-msg {
  color: #a00;
  font-size: 13px;
  margin-top: 8px;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<a class="back-link" href="BOM Register.html">⬅ BOM Register</a>
<div class="title">Bill of Materials</div>

<div id="readonlyNote" class="readonly-note" style="display:none;"></div>

<!-- 1️⃣ BOM HEADER -->
<div class="section-box">
  <div class="section-title">BOM Details</div>

  <label>BOM No:
    <input type="text" id="bomNo" readonly style="width:110px;">
  </label>

  <label>Version:
    <input type="text" id="version" readonly style="width:60px;">
  </label>

  <label>Status:
    <span id="statusBadge" class="badge badge-NEW">NEW</span>
  </label>

  <br><br>

  <label class="item-wrap">FG / WIP Item:
    <input type="text" id="fgItemSearch" placeholder="Search finished good / WIP item" autocomplete="off" style="width:260px;">
    <div id="suggestions"></div>
  </label>

  <label>Effective Date:
    <input type="date" id="effectiveDate">
  </label>

  <br><br>
  <label style="margin-right:0;">Narration:
    <input type="text" id="narration" placeholder="Optional note" style="width:400px;">
  </label>
</div>

<!-- 2️⃣ ADD COMPONENT -->
<div class="section-box">
  <div class="section-title">Add Component</div>

  <label class="item-wrap">Component:
    <input type="text" id="componentSearch" placeholder="Search component item" autocomplete="off">
    <div id="componentSuggestions"></div>
  </label>

  <label>Qty per Unit:
    <input type="number" id="componentQty" value="1" min="0" step="any" style="width:100px;">
  </label>

  <label>Unit:
    <input type="text" id="componentUnit" style="width:80px;">
  </label>

  <label>Narration:
    <input type="text" id="componentNarration" placeholder="Optional" style="width:180px;">
  </label>

  <button onclick="addComponent()">Add Component</button>
</div>

<!-- 3️⃣ COMPONENT LINES -->
<div class="section-box">
  <div class="section-title">Component Lines</div>

  <table id="linesTable">
    <tr>
      <th>Component</th>
      <th>Qty per Unit</th>
      <th>Unit</th>
      <th>Narration</th>
      <th></th>
    </tr>
  </table>
  <div id="noLinesMsg" style="text-align:center; padding:10px; color:#666;">No components added yet.</div>
</div>

<!-- 4️⃣ BOM COST -->
<div class="section-box">
  <div class="section-title">BOM Cost</div>

  <button id="viewCostBtn" onclick="viewCost()" disabled>📊 View BOM Cost</button>
  <div id="costHint" style="font-size:12px; color:#666; margin-top:6px;">Save this BOM first to view its cost.</div>

  <div id="costBox" style="display:none; margin-top:10px;">
    <table id="costTable">
      <tr>
        <th>Component</th>
        <th>Qty per Unit</th>
        <th>Unit</th>
        <th>Current Rate</th>
        <th>Line Cost</th>
      </tr>
    </table>
    <div class="totals-box">
      <div class="grand">Total Cost per <span id="costFgUnit"></span>: ₹<span id="totalCost"></span></div>
    </div>
  </div>
</div>

<!-- 5️⃣ SAVE -->
<div class="section-box save-actions">
  <button id="saveDraftBtn" onclick="saveDraft()">💾 Save Draft</button>
  <button id="activateBtn" onclick="activateBOM()">✅ Activate</button>
  <button id="newVersionBtn" onclick="createNewVersion()" style="display:none;">🔁 Create New Version to Edit</button>
  <div id="errorMsg" class="error-msg"></div>
</div>

<script>
let currentBomId = null;      // null until the first Save Draft / Activate
let currentStatus = "NEW";    // NEW (unsaved) | DRAFT | ACTIVE | OBSOLETE
let selectedFgItem = null;    // { id, item_name, unit }
let selectedComponent = null; // { id, item_name, unit } while composing a line
let componentLines = [];      // [{ component_item_id, component_item_name, qty_per_unit, unit, narration }]

const fgItemSearch = document.getElementById("fgItemSearch");
const suggestionsBox = document.getElementById("suggestions");
const componentSearch = document.getElementById("componentSearch");
const componentSuggestionsBox = document.getElementById("componentSuggestions");
const componentUnit = document.getElementById("componentUnit");
const linesTable = document.getElementById("linesTable");
const noLinesMsg = document.getElementById("noLinesMsg");
const statusBadge = document.getElementById("statusBadge");
const readonlyNote = document.getElementById("readonlyNote");
const saveDraftBtn = document.getElementById("saveDraftBtn");
const activateBtn = document.getElementById("activateBtn");
const newVersionBtn = document.getElementById("newVersionBtn");
const errorMsg = document.getElementById("errorMsg");
const viewCostBtn = document.getElementById("viewCostBtn");
const costHint = document.getElementById("costHint");
const costBox = document.getElementById("costBox");
const costTable = document.getElementById("costTable");

window.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("effectiveDate").value = new Date().toISOString().slice(0, 10);

  const params = new URLSearchParams(window.location.search);
  const bomId = params.get("bom_id");

  if (bomId) {
    await loadBOM(bomId);
  } else {
    setStatus("NEW");
  }
});

/* 🔍 FG / WIP ITEM AUTOCOMPLETE — filtered client-side to FINISHED_GOOD/WIP
   per the item_type classifier already on item_master. Only usable when
   composing a brand-new BOM; once a bom_id is loaded the FG item is fixed
   for the life of that row (see loadBOM's lock-down below). */
fgItemSearch.addEventListener("input", async () => {
  selectedFgItem = null;
  const q = fgItemSearch.value.trim();

  if (q.length < 2) {
    suggestionsBox.innerHTML = "";
    return;
  }

  const res = await fetch(API_BASE_URL + `/items/search?q=${encodeURIComponent(q)}`);
  const list = (await res.json()).filter(
    item => item.item_type === "FINISHED_GOOD" || item.item_type === "WIP"
  );

  suggestionsBox.innerHTML = "";
  list.forEach(item => {
    const div = document.createElement("div");
    div.textContent = `${item.item_name} (${item.item_type === "WIP" ? "WIP" : "FG"}, ${item.unit})`;
    div.onclick = () => {
      selectedFgItem = item;
      fgItemSearch.value = item.item_name;
      suggestionsBox.innerHTML = "";
    };
    suggestionsBox.appendChild(div);
  });
});

/* 🔍 COMPONENT AUTOCOMPLETE — any item can be a component; self-reference
   (component === the FG/WIP this BOM is for) is caught client-side as a
   courtesy, with the authoritative check landing at the API layer later
   (Step 10). */
componentSearch.addEventListener("input", async () => {
  selectedComponent = null;
  const q = componentSearch.value.trim();

  if (q.length < 2) {
    componentSuggestionsBox.innerHTML = "";
    return;
  }

  const res = await fetch(API_BASE_URL + `/items/search?q=${encodeURIComponent(q)}`);
  const list = await res.json();

  componentSuggestionsBox.innerHTML = "";
  list.forEach(item => {
    const div = document.createElement("div");
    div.textContent = `${item.item_name} (${item.unit})`;
    div.onclick = () => {
      selectedComponent = item;
      componentSearch.value = item.item_name;
      componentUnit.value = item.unit || "";
      componentSuggestionsBox.innerHTML = "";
    };
    componentSuggestionsBox.appendChild(div);
  });
});

document.addEventListener("click", (e) => {
  if (!suggestionsBox.contains(e.target) && e.target !== fgItemSearch) {
    suggestionsBox.innerHTML = "";
  }
  if (!componentSuggestionsBox.contains(e.target) && e.target !== componentSearch) {
    componentSuggestionsBox.innerHTML = "";
  }
});

/* Loads an existing BOM version for viewing/editing. DRAFT versions stay
   fully editable; ACTIVE/OBSOLETE versions are historical records, so the
   screen locks down and offers "Create New Version" instead (mirrors what
   PUT /bom/:id itself will refuse). */
async function loadBOM(bomId) {
  try {
    const res = await fetch(API_BASE_URL + `/bom/${bomId}`);
    const data = await res.json();
    if (data.error) {
      errorMsg.textContent = data.error;
      return;
    }

    currentBomId = data.id;
    document.getElementById("bomNo").value = data.bom_no;
    document.getElementById("version").value = data.version;
    document.getElementById("effectiveDate").value = data.effective_date || "";
    document.getElementById("narration").value = data.narration || "";

    selectedFgItem = { id: data.fg_item_id, item_name: data.fg_item_name, unit: data.fg_unit };
    fgItemSearch.value = data.fg_item_name;

    componentLines = (data.items || []).map(it => ({
      component_item_id: it.component_item_id,
      component_item_name: it.component_item_name,
      qty_per_unit: it.qty_per_unit,
      unit: it.unit || it.component_unit,
      narration: it.narration
    }));

    renderLines();
    setStatus(data.status);
  } catch (err) {
    console.error(err);
    errorMsg.textContent = "Error loading BOM";
  }
}

/* Applies the read/write rules for a given status: NEW and DRAFT are
   editable (header FG item only while NEW — it's fixed once a row
   exists), ACTIVE/OBSOLETE are locked and surface "Create New Version". */
function setStatus(status) {
  currentStatus = status;
  statusBadge.textContent = status;
  statusBadge.className = `badge badge-${status}`;

  const isNew = status === "NEW";
  const isDraft = status === "DRAFT";
  const isLocked = !isNew && !isDraft;

  fgItemSearch.disabled = !isNew;
  document.getElementById("effectiveDate").disabled = !isNew;
  document.getElementById("narration").disabled = !isNew;
  componentSearch.disabled = isLocked;
  document.getElementById("componentQty").disabled = isLocked;
  componentUnit.disabled = isLocked;
  document.getElementById("componentNarration").disabled = isLocked;

  saveDraftBtn.style.display = isLocked ? "none" : "inline-block";
  activateBtn.style.display = isLocked ? "none" : "inline-block";
  newVersionBtn.style.display = isLocked ? "inline-block" : "none";

  viewCostBtn.disabled = !currentBomId;
  costHint.style.display = currentBomId ? "none" : "block";

  if (isLocked) {
    readonlyNote.style.display = "block";
    readonlyNote.textContent =
      `This version is ${status} and read-only. Use "Create New Version to Edit" to make changes — it will clone these components into a fresh DRAFT.`;
  } else if (!isNew) {
    readonlyNote.style.display = "block";
    readonlyNote.textContent =
      "Effective Date and Narration are set once, when the version is first saved, and can't be changed on this DRAFT — only the component lines can. Start a new version to change them.";
  } else {
    readonlyNote.style.display = "none";
  }

  renderLines();
}

/* ➕ ADD COMPONENT LINE */
function addComponent() {
  errorMsg.textContent = "";

  const qty = Number(document.getElementById("componentQty").value);
  const unit = componentUnit.value.trim();
  const narration = document.getElementById("componentNarration").value.trim();

  if (!selectedComponent) {
    errorMsg.textContent = "Select a component from the suggestions list";
    return;
  }
  if (!qty || qty <= 0) {
    errorMsg.textContent = "Enter a qty per unit greater than zero";
    return;
  }
  if (selectedFgItem && selectedComponent.id === selectedFgItem.id) {
    errorMsg.textContent = "A component can't be the same item as the FG/WIP this BOM is for";
    return;
  }
  if (componentLines.some(l => l.component_item_id === selectedComponent.id)) {
    errorMsg.textContent = "This component is already on the BOM — remove it first if you want to change its qty";
    return;
  }

  componentLines.push({
    component_item_id: selectedComponent.id,
    component_item_name: selectedComponent.item_name,
    qty_per_unit: qty,
    unit: unit || selectedComponent.unit,
    narration: narration || null
  });

  renderLines();

  selectedComponent = null;
  componentSearch.value = "";
  componentUnit.value = "";
  document.getElementById("componentQty").value = 1;
  document.getElementById("componentNarration").value = "";
}

function removeComponent(idx) {
  componentLines.splice(idx, 1);
  renderLines();
}

function renderLines() {
  costBox.style.display = "none"; // lines just changed — last cost view is stale

  linesTable.innerHTML = `
    <tr>
      <th>Component</th>
      <th>Qty per Unit</th>
      <th>Unit</th>
      <th>Narration</th>
      <th></th>
    </tr>
  `;

  const isLocked = currentStatus !== "NEW" && currentStatus !== "DRAFT";

  componentLines.forEach((line, idx) => {
    const row = linesTable.insertRow();
    row.innerHTML = `
      <td>${line.component_item_name}</td>
      <td class="center">${line.qty_per_unit}</td>
      <td class="center">${line.unit || ""}</td>
      <td>${line.narration || ""}</td>
      <td class="center">${isLocked ? "" : `<button onclick="removeComponent(${idx})">✕</button>`}</td>
    `;
  });

  noLinesMsg.style.display = componentLines.length ? "none" : "block";
}

/* 💾 SAVE DRAFT — POST /bom/create for a brand-new BOM, PUT /bom/:id
   (items-only, per the API's own contract) once a DRAFT row exists. */
async function saveDraft() {
  errorMsg.textContent = "";

  if (!validateBeforeSave()) return;

  try {
    if (!currentBomId) {
      const res = await fetch(API_BASE_URL + "/bom/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          fgItemId: selectedFgItem.id,
          effectiveDate: document.getElementById("effectiveDate").value || null,
          narration: document.getElementById("narration").value.trim() || null,
          items: linesPayload()
        })
      });
      const data = await res.json();
      if (data.error) { errorMsg.textContent = data.error; return; }

      currentBomId = data.id;
      document.getElementById("bomNo").value = data.bom_no;
      document.getElementById("version").value = data.version;
      history.replaceState(null, "", `Bill of Materials.html?bom_id=${data.id}`);
      setStatus("DRAFT");
      alert(`BOM ${data.bom_no} (v${data.version}) saved as DRAFT`);
    } else {
      const res = await fetch(API_BASE_URL + `/bom/${currentBomId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: linesPayload() })
      });
      const data = await res.json();
      if (data.error) { errorMsg.textContent = data.error; return; }

      alert("BOM draft updated");
    }
  } catch (err) {
    console.error(err);
    errorMsg.textContent = "Error saving BOM";
  }
}

/* ✅ ACTIVATE — makes sure the DRAFT's items are saved first (creating the
   row if this is the very first save), then flips it to ACTIVE. The
   backend takes care of stepping whatever was previously ACTIVE for this
   FG down to OBSOLETE in the same transaction. */
async function activateBOM() {
  errorMsg.textContent = "";

  if (!validateBeforeSave()) return;

  try {
    if (!currentBomId) {
      const res = await fetch(API_BASE_URL + "/bom/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          fgItemId: selectedFgItem.id,
          effectiveDate: document.getElementById("effectiveDate").value || null,
          narration: document.getElementById("narration").value.trim() || null,
          items: linesPayload()
        })
      });
      const data = await res.json();
      if (data.error) { errorMsg.textContent = data.error; return; }
      currentBomId = data.id;
      document.getElementById("bomNo").value = data.bom_no;
      document.getElementById("version").value = data.version;
    } else {
      const res = await fetch(API_BASE_URL + `/bom/${currentBomId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: linesPayload() })
      });
      const data = await res.json();
      if (data.error) { errorMsg.textContent = data.error; return; }
    }

    const actRes = await fetch(API_BASE_URL + `/bom/${currentBomId}/activate`, { method: "POST" });
    const actData = await actRes.json();
    if (actData.error) { errorMsg.textContent = actData.error; return; }

    history.replaceState(null, "", `Bill of Materials.html?bom_id=${currentBomId}`);
    setStatus("ACTIVE");
    alert("BOM activated — this is now the active version for this item");
  } catch (err) {
    console.error(err);
    errorMsg.textContent = "Error activating BOM";
  }
}

/* 🔁 CREATE NEW VERSION — clones the currently ACTIVE version's lines into
   a fresh DRAFT (Step 2/3's /new-version endpoint) and jumps straight into
   editing it. */
async function createNewVersion() {
  errorMsg.textContent = "";
  if (!selectedFgItem) return;

  try {
    const res = await fetch(API_BASE_URL + `/bom/${selectedFgItem.id}/new-version`, { method: "POST" });
    const data = await res.json();
    if (data.error) { errorMsg.textContent = data.error; return; }

    window.location.href = `Bill of Materials.html?bom_id=${data.id}`;
  } catch (err) {
    console.error(err);
    errorMsg.textContent = "Error creating new version";
  }
}

/* 📊 VIEW BOM COST — pulls the live standard-costing rollup (Step 5) and
   renders it inline, same "table appears in place, no separate page"
   approach as Item Wise Report's by-location table. Available for any
   saved version (DRAFT, ACTIVE, or OBSOLETE) since costing a historical
   version against current rates is still a meaningful "what would this
   cost today" question. */
async function viewCost() {
  errorMsg.textContent = "";
  if (!currentBomId) return;

  viewCostBtn.disabled = true;
  viewCostBtn.textContent = "Loading...";

  try {
    const res = await fetch(API_BASE_URL + `/bom/${currentBomId}/cost`);
    const data = await res.json();
    if (data.error) { errorMsg.textContent = data.error; return; }

    costTable.innerHTML = `
      <tr>
        <th>Component</th>
        <th>Qty per Unit</th>
        <th>Unit</th>
        <th>Current Rate</th>
        <th>Line Cost</th>
      </tr>
    `;

    (data.components || []).forEach(c => {
      const row = costTable.insertRow();
      row.innerHTML = `
        <td>${c.component_item_name}</td>
        <td class="center">${c.qty_per_unit}</td>
        <td class="center">${c.unit || ""}</td>
        <td class="amount">₹${Number(c.current_rate).toFixed(2)}</td>
        <td class="amount">₹${Number(c.line_cost).toFixed(2)}</td>
      `;
    });

    document.getElementById("costFgUnit").textContent = data.fg_unit || "unit";
    document.getElementById("totalCost").textContent = Number(data.total_cost_per_unit).toFixed(2);
    costBox.style.display = "block";
  } catch (err) {
    console.error(err);
    errorMsg.textContent = "Error loading BOM cost";
  } finally {
    viewCostBtn.disabled = !currentBomId;
    viewCostBtn.textContent = "📊 View BOM Cost";
  }
}

function validateBeforeSave() {
  if (!selectedFgItem) {
    errorMsg.textContent = "Select an FG/WIP item from the suggestions list";
    return false;
  }
  if (componentLines.length === 0) {
    errorMsg.textContent = "Add at least one component";
    return false;
  }
  return true;
}

function linesPayload() {
  return componentLines.map(l => ({
    component_item_id: l.component_item_id,
    qty_per_unit: l.qty_per_unit,
    unit: l.unit || null,
    narration: l.narration || null
  }));
}
</script>

</body>
</html>
