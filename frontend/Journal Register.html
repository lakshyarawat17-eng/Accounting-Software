<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Journal Register</title>

<style>
body {
  font-family: "Times New Roman", serif;
  background: #f5f5f5;
}

.container {
  width: 900px;
  margin: 30px auto;
  background: white;
  padding: 20px;
  border: 1px solid black;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid black;
  padding: 6px;
  text-align: center;
}

th {
  background: #eee;
}

td.narration {
  text-align: left;
}

button {
  padding: 4px 10px;
  cursor: pointer;
}

.invoice {
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>Journal Register (Delete Entries)</h2>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Voucher No</th>
        <th>Invoice No</th>        
        <th>Narration</th>
        <th>Debit (₹)</th>
        <th>Credit (₹)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="journalList"></tbody>
  </table>
</div>

<script>
const tbody = document.getElementById("journalList");

function loadJournals() {
  fetch(API_BASE_URL + "/journal/all")
    .then(res => res.json())
    .then(data => {
      tbody.innerHTML = "";
      data.forEach(j => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${j.date}</td>
          <td>
            <a href="#" onclick="viewVoucher(${j.id})">
              ${j.voucher_no}
            </a>
          </td>
          <td class="center invoice">${extractInvoiceNo(j.narration)}</td>
          <td class="narration">${j.narration || ""}</td>
          <td>${j.total_debit}</td>
          <td>${j.total_credit}</td>
          <td>
            <button onclick="deleteVoucher(${j.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
}

function extractInvoiceNo(narration) {
  if (!narration) return "";
  const match = narration.match(/Sales Invoice\s+(INV-\d+)/i);
  return match ? match[1] : "";
}

function viewVoucher(id) {
  fetch(API_BASE_URL + `/journal/${id}/details`)
    .then(res => res.json())
    .then(rows => {
      if (!rows.length) return;

      let html = `
        <h3>Journal Voucher</h3>
        <p><b>Date:</b> ${rows[0].date}</p>
        <p><b>Voucher No:</b> ${rows[0].voucher_no}</p>

        <table style="width:100%;border-collapse:collapse" border="1">
          <tr>
            <th>Particulars</th>
            <th>L.F.</th>
            <th>Debit</th>
            <th>Credit</th>
          </tr>
      `;

      rows.forEach(r => {
        html += `
          <tr>
            <td>${r.ledger}</td>
            <td>${r.lf || ""}</td>
            <td style="text-align:right">${r.debit || ""}</td>
            <td style="text-align:right">${r.credit || ""}</td>
          </tr>
        `;
      });

      html += `
        </table>
        <p><b>Narration:</b> ${rows[0].narration || ""}</p>
      `;

      const w = window.open("", "_blank", "width=700,height=500");
      w.document.write(`
        <html>
          <head>
            <title>Voucher ${rows[0].voucher_no}</title>
            <style>
              body { font-family: "Times New Roman"; padding: 20px; }
              h3 { text-align: center; }
              table { margin-top: 10px; }
            </style>
          </head>
          <body>${html}</body>
        </html>
      `);
    });
}

function deleteVoucher(id) {
  if (!confirm("Are you sure you want to delete this entire voucher?")) return;

  fetch(API_BASE_URL + `/journal/${id}`, { method: "DELETE" })
    .then(res => res.json())
    .then(() => {
      alert("Voucher deleted");
      loadJournals();
    });
}

loadJournals();
</script>

</body>
</html>
