<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Suppliers</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

<style>
body { font-family: "Times New Roman", serif; background:#fafafa; }
.container { width: 720px; margin: 40px auto; background:#fff; padding:20px; border:1px solid #000; }
h2 { text-align: center; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.form-grid .full { grid-column: 1 / -1; }
label { display: block; margin-top: 12px; font-size: 14px; }
input, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; font-family: inherit; }
textarea { resize: vertical; min-height: 50px; }
button { margin-top: 15px; padding: 6px 14px; cursor: pointer; }
.btn-row { text-align: right; }
.btn-row button { margin-left: 8px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid black; padding: 6px; font-size: 13px; }
th { background: #f2f2f2; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: #f0f0f0; }
#formTitle { margin-top: 0; }
#statusMsg { margin-top: 10px; font-size: 13px; color: #a00; }
#searchBox { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<div class="container">
  <h2 id="formTitle">Add Supplier</h2>

  <div class="form-grid">
    <label class="full">
      Supplier / Company Name *
      <input type="text" id="supplierName" autocomplete="off">
    </label>

    <label>
      Email
      <input type="email" id="supplierEmail" autocomplete="off">
    </label>

    <label>
      Phone (with country code)
      <input type="text" id="supplierPhone" placeholder="+91XXXXXXXXXX" autocomplete="off">
    </label>

    <label class="full">
      Address
      <textarea id="supplierAddress"></textarea>
    </label>

    <label>
      GSTIN / Tax ID
      <input type="text" id="supplierGstin" autocomplete="off">
    </label>

    <label class="full">
      Notes
      <textarea id="supplierNotes"></textarea>
    </label>
  </div>

  <div id="statusMsg"></div>

  <div class="btn-row">
    <button id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">Cancel Edit</button>
    <button id="saveBtn" onclick="saveSupplier()">Save Supplier</button>
  </div>

  <hr style="margin-top:25px;">

  <label>
    Search Suppliers
    <input type="text" id="searchBox" placeholder="Type a name to filter…">
  </label>

  <table id="suppliersTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>GSTIN</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
let allSuppliers = [];
let editingId = null;

/* ---------------- LOAD SUPPLIERS ---------------- */
async function loadSuppliers() {
  try {
    const res = await fetch(API_BASE_URL + "/suppliers");
    if (!res.ok) throw new Error("HTTP " + res.status);
    allSuppliers = await res.json();
    renderTable(allSuppliers);
  } catch (err) {
    console.error("SUPPLIER LOAD ERROR:", err);
    document.querySelector("#suppliersTable tbody").innerHTML =
      `<tr><td colspan="4">Failed to load suppliers</td></tr>`;
  }
}

function renderTable(rows) {
  const tbody = document.querySelector("#suppliersTable tbody");
  tbody.innerHTML = "";

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="4">No suppliers yet</td></tr>`;
    return;
  }

  rows.forEach(c => {
    const tr = document.createElement("tr");
    tr.className = "clickable";
    tr.innerHTML = `
      <td>${c.name}</td>
      <td>${c.email || ""}</td>
      <td>${c.phone || ""}</td>
      <td>${c.gstin || ""}</td>
    `;
    tr.onclick = () => startEdit(c);
    tbody.appendChild(tr);
  });
}

/* ---------------- SEARCH / FILTER ---------------- */
document.getElementById("searchBox").addEventListener("input", () => {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  if (!q) return renderTable(allSuppliers);
  renderTable(allSuppliers.filter(c => c.name.toLowerCase().includes(q)));
});

/* ---------------- EDIT MODE ---------------- */
function startEdit(c) {
  editingId = c.id;
  document.getElementById("formTitle").textContent = "Edit Supplier";
  document.getElementById("supplierName").value = c.name || "";
  document.getElementById("supplierEmail").value = c.email || "";
  document.getElementById("supplierPhone").value = c.phone || "";
  document.getElementById("supplierAddress").value = c.address || "";
  document.getElementById("supplierGstin").value = c.gstin || "";
  document.getElementById("supplierNotes").value = c.notes || "";
  document.getElementById("saveBtn").textContent = "Update Supplier";
  document.getElementById("cancelEditBtn").style.display = "inline-block";
  document.getElementById("statusMsg").textContent = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelEdit() {
  editingId = null;
  document.getElementById("formTitle").textContent = "Add Supplier";
  document.getElementById("supplierName").value = "";
  document.getElementById("supplierEmail").value = "";
  document.getElementById("supplierPhone").value = "";
  document.getElementById("supplierAddress").value = "";
  document.getElementById("supplierGstin").value = "";
  document.getElementById("supplierNotes").value = "";
  document.getElementById("saveBtn").textContent = "Save Supplier";
  document.getElementById("cancelEditBtn").style.display = "none";
  document.getElementById("statusMsg").textContent = "";
}

/* ---------------- SAVE / UPDATE ---------------- */
async function saveSupplier() {
  const gstinRaw = document.getElementById("supplierGstin").value.trim().toUpperCase();
  document.getElementById("supplierGstin").value = gstinRaw;

  const payload = {
    name: document.getElementById("supplierName").value.trim(),
    email: document.getElementById("supplierEmail").value.trim(),
    phone: document.getElementById("supplierPhone").value.trim(),
    address: document.getElementById("supplierAddress").value.trim(),
    gstin: gstinRaw,
    notes: document.getElementById("supplierNotes").value.trim()
  };

  if (!payload.name) {
    document.getElementById("statusMsg").textContent = "Supplier name is required";
    return;
  }

  // Quick supplier-side shape check for faster feedback — the backend
  // re-validates this regardless, so it's still enforced either way.
  const GSTIN_PATTERN = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;
  if (payload.gstin && !GSTIN_PATTERN.test(payload.gstin)) {
    document.getElementById("statusMsg").textContent =
      "That doesn't look like a valid 15-character GSTIN (e.g. 27ABCDE1234F1Z5). Leave blank if this supplier isn't GST-registered.";
    return;
  }

  const url = editingId
    ? API_BASE_URL + "/suppliers/" + editingId
    : API_BASE_URL + "/suppliers/create";
  const method = editingId ? "PUT" : "POST";

  try {
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Save failed");

    cancelEdit();
    loadSuppliers();
  } catch (err) {
    console.error("SAVE SUPPLIER ERROR:", err);
    document.getElementById("statusMsg").textContent = err.message;
  }
}

/* ---------------- INIT ---------------- */
window.addEventListener("DOMContentLoaded", loadSuppliers);
</script>

</body>
</html>
