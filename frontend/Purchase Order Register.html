<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Purchase Order Register</title>

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.back-link {
  display: inline-block;
  margin-bottom: 10px;
}

.top-actions {
  text-align: right;
  margin-bottom: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
  color: white;
}
.badge-OPEN { background: #888; }
.badge-PARTIALLY_RECEIVED { background: #d18f00; }
.badge-RECEIVED { background: #1a7f37; }
.badge-PARTIALLY_INVOICED { background: #b35c00; }
.badge-CLOSED { background: #0969da; }
.badge-CANCELLED { background: #c00; }

button {
  margin: 1px;
  cursor: pointer;
}

.empty {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<a class="back-link" href="Main Menu.html">⬅ Main Menu</a>
<div class="title">Purchase Order Register</div>

<div class="top-actions">
  <a href="Purchase Order.html"><button>➕ New Purchase Order</button></a>
</div>

<table id="poTable">
  <tr>
    <th>PO No</th>
    <th>Date</th>
    <th>Supplier</th>
    <th>Status</th>
    <th>Qty (Recd / Ordered)</th>
    <th>Grand Total</th>
    <th>Actions</th>
  </tr>
</table>
<div id="emptyMsg" class="empty" style="display:none;">No purchase orders yet.</div>

<script>
const STATUS_LABELS = {
  OPEN: "Open",
  PARTIALLY_RECEIVED: "Partially Received",
  RECEIVED: "Received",
  PARTIALLY_INVOICED: "Partially Invoiced",
  CLOSED: "Closed",
  CANCELLED: "Cancelled"
};

async function loadPOs() {
  const res = await fetch(API_BASE_URL + "/po/list");
  const list = await res.json();

  const table = document.getElementById("poTable");
  const emptyMsg = document.getElementById("emptyMsg");

  table.innerHTML = `
    <tr>
      <th>PO No</th>
      <th>Date</th>
      <th>Supplier</th>
      <th>Status</th>
      <th>Qty (Recd / Ordered)</th>
      <th>Grand Total</th>
      <th>Actions</th>
    </tr>
  `;

  if (!list.length) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  list.forEach(po => {
    const row = table.insertRow();

    const canReceive = ["OPEN", "PARTIALLY_RECEIVED"].includes(po.status);
    const canInvoice = po.total_received > po.total_invoiced && po.status !== "CANCELLED";
    const canCancel = po.status === "OPEN" && po.total_received === 0 && po.total_invoiced === 0;

    row.innerHTML = `
      <td>${po.po_no}</td>
      <td class="center">${po.date}</td>
      <td>${po.supplier}</td>
      <td class="center"><span class="badge badge-${po.status}">${STATUS_LABELS[po.status] || po.status}</span></td>
      <td class="center">${po.total_received} / ${po.total_qty}</td>
      <td class="amount">₹${po.grand_total.toFixed(2)}</td>
      <td class="center">
        ${canReceive ? `<button onclick="goReceive(${po.id})">📥 Receive Goods</button>` : ""}
        ${canInvoice ? `<button onclick="goInvoice(${po.id})">🧾 Create Invoice</button>` : ""}
        ${canCancel ? `<button onclick="cancelPO(${po.id})">✕ Cancel</button>` : ""}
      </td>
    `;
  });
}

function goReceive(id) {
  window.location.href = `Goods Receipt.html?po_id=${id}`;
}

function goInvoice(id) {
  window.location.href = `Purchase Book.html?po_id=${id}`;
}

function cancelPO(id) {
  if (!confirm("Cancel this purchase order?")) return;

  fetch(API_BASE_URL + `/po/${id}/cancel`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        alert(data.error);
        return;
      }
      loadPOs();
    })
    .catch(() => alert("Error cancelling purchase order"));
}

loadPOs();
</script>

</body>
</html>
