<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
/* Page setup for printing */
@page {
  margin: 20mm;
}

/* General styling */
body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

/* Ledger title */
.header {
  text-align: center;
  margin-bottom: 6px;
}

.header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: bold;
}

/* Dr / Cr row */
.drcr {
  display: flex;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 6px;
}

.drcr h3 {
  margin: 0;
  font-size: 16px;
  font-weight: bold;
}

/* Table styling */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid black;
  padding: 6px;
  text-align: left;
  vertical-align: top;
}

/* Header row */
th {
  text-align: center;
  font-weight: bold;
}

/* Amount column alignment */
.amount {
  text-align: right;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<!-- Ledger Name -->
<div class="header">
  <h2>Cash/Bank Book of "Entity Name"</h2>
</div>

<!-- Dr and Cr -->
<div class="drcr">
  <h3>Dr.</h3>
  <h3>Cr.</h3>
</div>

<!-- Ledger Table -->
<table>
  <tr>
    <th>Date</th>
    <th>Particulars</th>
    <th>J.F.</th>
    <th>Cash (₹)</th>
    <th>Bank (₹)</th>
    <th>Date</th>
    <th>Particulars</th>
    <th>J.F.</th>
    <th>Cash (₹)</th>
    <th>Bank (₹)</th>
  </tr>

  <tr>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td class="amount">&nbsp;</td>
    <td class="amount">&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td class="amount">&nbsp;</td>
    <td class="amount">&nbsp;</td>
  </tr>
</table>

</body>
</html>
