<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Salary Structure</title>
<style>
body { font-family: "Times New Roman", serif; background:#fafafa; }
.container { width: 820px; max-width: 96%; margin: 40px auto; background:#fff; padding:20px; border:1px solid #000; }
h2 { text-align: center; margin-top: 0; }
.top-links { text-align:right; font-size:12px; margin-bottom:8px; }
label { display:block; margin-top: 10px; font-size: 13px; }
input, select { padding: 5px; font-family: inherit; font-size: 13px; box-sizing: border-box; }
#employeeSearch { width: 100%; }
#searchResults { border: 1px solid #ccc; max-height: 150px; overflow-y: auto; display:none; }
#searchResults div { padding: 5px 8px; cursor: pointer; font-size: 13px; }
#searchResults div:hover { background: #eef; }
.selected-emp { margin-top: 8px; padding: 8px; background: #f4f4f4; border: 1px solid #ccc; font-size: 13px; }
table { width: 100%; border-collapse: collapse; margin-top: 16px; }
th, td { border: 1px solid black; padding: 5px 6px; font-size: 12.5px; }
th { background: #f2f2f2; }
td input, td select { width: 100%; }
.row-actions { text-align:center; width: 30px; }
button { padding: 6px 12px; cursor: pointer; }
.btn-row { margin-top: 12px; text-align: right; }
#statusMsg { margin-top: 10px; font-size: 13px; }
.ctc-box { margin-top: 16px; padding: 10px; border: 1px solid #999; background: #fafff0; font-size: 13px; }
.help { font-size: 11px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="top-links"><a href="Main Menu.html">&larr; Main Menu</a></div>
  <h2>Salary Structure</h2>

  <label>Search Employee
    <input type="text" id="employeeSearch" placeholder="Type name or code…" autocomplete="off">
  </label>
  <div id="searchResults"></div>
  <div class="selected-emp" id="selectedEmp" style="display:none;"></div>

  <table id="compTable">
    <thead>
      <tr><th>Component</th><th>Type</th><th>Calculation</th><th>Value</th><th></th></tr>
    </thead>
    <tbody id="compBody"></tbody>
  </table>
  <div class="help">Exactly one FIXED Earning component must be named "Basic" — percentage components (HRA etc.) are calculated off it.</div>

  <div class="btn-row">
    <button onclick="addRow()">+ Add Component</button>
    <button onclick="saveStructure()">Save Structure</button>
  </div>

  <div id="statusMsg"></div>
  <div class="ctc-box" id="ctcBox" style="display:none;"></div>
</div>

<script>
const API = window.API_BASE_URL;
let selectedEmployeeId = null;

const searchBox = document.getElementById("employeeSearch");
const resultsBox = document.getElementById("searchResults");

searchBox.addEventListener("input", async () => {
  const q = searchBox.value.trim();
  if (!q) { resultsBox.style.display = "none"; return; }
  const res = await fetch(`${API}/hr/employees/search?q=${encodeURIComponent(q)}`);
  const rows = await res.json();
  resultsBox.innerHTML = "";
  rows.forEach(e => {
    const div = document.createElement("div");
    div.textContent = `${e.employee_code} — ${e.full_name} (${e.department||"-"})`;
    div.onclick = () => selectEmployee(e);
    resultsBox.appendChild(div);
  });
  resultsBox.style.display = rows.length ? "block" : "none";
});

async function selectEmployee(e) {
  selectedEmployeeId = e.id;
  resultsBox.style.display = "none";
  searchBox.value = "";
  document.getElementById("selectedEmp").style.display = "block";
  document.getElementById("selectedEmp").textContent = `${e.employee_code} — ${e.full_name} (${e.department||"-"} / ${e.designation||"-"})`;
  await loadStructure();
}

function addRow(name = "", type = "EARNING", calc = "FIXED", value = "") {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input type="text" class="c-name" value="${name}"></td>
    <td><select class="c-type"><option value="EARNING">Earning</option><option value="DEDUCTION">Deduction</option></select></td>
    <td><select class="c-calc"><option value="FIXED">Fixed Amount</option><option value="PERCENT_OF_BASIC">% of Basic</option><option value="PERCENT_OF_GROSS">% of Gross</option></select></td>
    <td><input type="number" class="c-value" value="${value}"></td>
    <td class="row-actions"><button onclick="this.closest('tr').remove()">✕</button></td>
  `;
  tr.querySelector(".c-type").value = type;
  tr.querySelector(".c-calc").value = calc;
  document.getElementById("compBody").appendChild(tr);
}

async function loadStructure() {
  document.getElementById("compBody").innerHTML = "";
  document.getElementById("ctcBox").style.display = "none";
  const res = await fetch(`${API}/hr/salary-structure/${selectedEmployeeId}`);
  const rows = await res.json();
  if (!rows.length) {
    addRow("Basic", "EARNING", "FIXED", "");
    addRow("HRA", "EARNING", "PERCENT_OF_BASIC", "40");
  } else {
    rows.forEach(r => addRow(r.component_name, r.component_type, r.calc_type, r.value));
    await loadCtc();
  }
}

async function loadCtc() {
  const res = await fetch(`${API}/hr/salary-structure/${selectedEmployeeId}/ctc`);
  if (!res.ok) return;
  const data = await res.json();
  const box = document.getElementById("ctcBox");
  box.style.display = "block";
  box.innerHTML = `<b>Monthly Gross:</b> ₹${data.monthly_gross.toFixed(2)} &nbsp; | &nbsp; <b>Annual CTC (earnings only):</b> ₹${data.annual_ctc_earnings_only.toFixed(2)}<br>` +
    data.components.map(c => `${c.name}: ₹${c.monthly.toFixed(2)}`).join(" &nbsp;·&nbsp; ");
}

async function saveStructure() {
  const msg = document.getElementById("statusMsg");
  if (!selectedEmployeeId) { msg.style.color = "#a00"; msg.textContent = "Select an employee first."; return; }
  const rows = [...document.querySelectorAll("#compBody tr")].map(tr => ({
    component_name: tr.querySelector(".c-name").value.trim(),
    component_type: tr.querySelector(".c-type").value,
    calc_type: tr.querySelector(".c-calc").value,
    value: Number(tr.querySelector(".c-value").value) || 0
  })).filter(r => r.component_name);

  if (!rows.length) { msg.style.color = "#a00"; msg.textContent = "Add at least one component."; return; }

  const res = await fetch(`${API}/hr/salary-structure/save`, {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ employeeId: selectedEmployeeId, effectiveFrom: new Date().toISOString().slice(0,10), components: rows })
  });
  const data = await res.json();
  if (!res.ok) { msg.style.color = "#a00"; msg.textContent = data.error || "Error saving structure"; return; }
  msg.style.color = "#070"; msg.textContent = "Salary structure saved.";
  loadCtc();
}
</script>
</body>
</html>
