<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileGrad2" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c4f9c"/>
      <stop offset="1" stop-color="#0e7c74"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="240" height="240" rx="56" fill="url(#tileGrad2)"/>

  <!-- ledger base -->
  <rect x="75" y="176" width="90" height="18" rx="9" fill="#ffffff"/>
  <!-- stand -->
  <rect x="112" y="108" width="16" height="72" rx="8" fill="#ffffff"/>

  <!-- balance beam -->
  <line x1="62" y1="82" x2="178" y2="82" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="62" y1="82" x2="62" y2="118" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>
  <line x1="178" y1="82" x2="178" y2="118" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>

  <!-- pans: rendered as system nodes -->
  <circle cx="62" cy="130" r="15" fill="#ffffff"/>
  <circle cx="178" cy="130" r="15" fill="#ffffff"/>

  <!-- pivot: the connecting accent node -->
  <circle cx="120" cy="88" r="11" fill="#f4b942"/>
</svg>
