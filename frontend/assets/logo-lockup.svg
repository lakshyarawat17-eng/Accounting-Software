<svg width="760" height="160" viewBox="0 0 760 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c4f9c"/>
      <stop offset="1" stop-color="#0e7c74"/>
    </linearGradient>
  </defs>

  <!-- icon tile -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="160" height="160" rx="38" fill="url(#tileGrad)"/>

    <rect x="50" y="117" width="60" height="12" rx="6" fill="#ffffff"/>
    <rect x="75" y="72" width="10" height="48" rx="5" fill="#ffffff"/>

    <line x1="41" y1="55" x2="119" y2="55" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="41" y1="55" x2="41" y2="79" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round"/>
    <line x1="119" y1="55" x2="119" y2="79" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round"/>

    <circle cx="41" cy="87" r="10" fill="#ffffff"/>
    <circle cx="119" cy="87" r="10" fill="#ffffff"/>
    <circle cx="80" cy="59" r="7.5" fill="#f4b942"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(196,0)" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="0" y="78" font-size="52" font-weight="800" letter-spacing="-1" fill="#14243f">Books of Accounts</text>
    <text x="2" y="108" font-size="18" font-weight="500" letter-spacing="0.2" fill="#6b7686">Accounting, built for the whole enterprise</text>
