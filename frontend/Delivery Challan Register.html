<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Delivery Challan Register</title>

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.back-link {
  display: inline-block;
  margin-bottom: 10px;
}

.top-actions {
  text-align: right;
  margin-bottom: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

.empty {
  text-align: center;
  padding: 20px;
  color: #666;
}

.detail-row td {
  background: #fafafa;
}
</style>
</head>

<body>

<a class="back-link" href="Sales Order Register.html">⬅ Sales Order Register</a>
<div class="title">Delivery Challan Register</div>

<div class="top-actions">
  <a href="Delivery Challan.html"><button>🚚 New Delivery Challan</button></a>
</div>

<table id="dcTable">
  <tr>
    <th>DC No</th>
    <th>Date</th>
    <th>Customer</th>
    <th>Against SO</th>
    <th>Items</th>
    <th>Total Qty</th>
    <th>Actions</th>
  </tr>
</table>
<div id="emptyMsg" class="empty" style="display:none;">No delivery challans yet.</div>

<script>
async function loadChallans() {
  const res = await fetch(API_BASE_URL + "/dc/list");
  const list = await res.json();

  const table = document.getElementById("dcTable");
  const emptyMsg = document.getElementById("emptyMsg");

  table.innerHTML = `
    <tr>
      <th>DC No</th>
      <th>Date</th>
      <th>Customer</th>
      <th>Against SO</th>
      <th>Items</th>
      <th>Total Qty</th>
      <th>Actions</th>
    </tr>
  `;

  if (!list.length) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  list.forEach(dc => {
    const row = table.insertRow();
    row.innerHTML = `
      <td>${dc.dc_no}</td>
      <td class="center">${dc.date}</td>
      <td>${dc.customer}</td>
      <td class="center">${dc.so_no || ""}</td>
      <td class="center">${dc.item_count}</td>
      <td class="center">${dc.total_qty}</td>
      <td class="center"><button onclick="toggleDetail(${dc.id}, this)">View Items</button></td>
    `;
  });
}

const openRows = {};

async function toggleDetail(id, btn) {
  const row = btn.closest("tr");

  if (openRows[id]) {
    openRows[id].remove();
    delete openRows[id];
    btn.textContent = "View Items";
    return;
  }

  btn.textContent = "Loading...";
  const res = await fetch(API_BASE_URL + `/dc/${id}`);
  const dc = await res.json();
  btn.textContent = "Hide Items";

  const detailRow = document.createElement("tr");
  detailRow.className = "detail-row";
  const cell = document.createElement("td");
  cell.colSpan = 7;
  cell.innerHTML = `
    <table>
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>GST %</th>
      </tr>
      ${dc.items.map(it => `
        <tr>
          <td>${it.item_name}</td>
          <td class="center">${it.qty}</td>
          <td class="amount">${it.rate != null ? it.rate.toFixed(2) : ""}</td>
          <td class="center">${it.gst_rate}%</td>
        </tr>
      `).join("")}
    </table>
    ${dc.narration ? `<div style="margin-top:6px;">Narration: ${dc.narration}</div>` : ""}
  `;
  detailRow.appendChild(cell);
  row.after(detailRow);
  openRows[id] = detailRow;
}

loadChallans();
</script>

</body>
</html>
