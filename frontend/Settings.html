<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Settings</title>

<style>
body { font-family: "Times New Roman", serif; background:#fafafa; margin:0; }
.container { width: 640px; margin: 40px auto; background:#fff; padding:25px 30px; border:1px solid #000; }
h2 { margin-top: 0; }
.back-link { display:inline-block; margin-bottom: 18px; text-decoration:none; color:#333; }
.section-title { font-weight:bold; margin: 22px 0 4px 0; font-size: 15px; }
.section-hint { color:#555; font-size:13px; margin-bottom: 14px; }

.template-list { display:flex; flex-direction:column; gap:10px; }

.template-option {
  border: 1px solid #999;
  padding: 12px 14px;
  cursor: pointer;
  display:flex;
  gap: 12px;
  align-items:flex-start;
}
.template-option:hover { background:#f5f5f5; }
.template-option.selected { border-color:#000; background:#eef1fb; }

.template-option input[type="radio"] { margin-top: 4px; }
.template-name { font-weight:bold; font-size:14px; }
.template-desc { font-size:12.5px; color:#444; margin-top:2px; }

button#saveBtn {
  margin-top: 20px;
  padding: 8px 18px;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

#status { margin-left: 12px; font-size: 13px; }
#status.ok { color: #1a7a1a; }
#status.err { color: #b00000; }

.loading, .error-msg { font-size: 13px; color:#555; }
</style>
</head>

<body>

<div class="container">
  <a class="back-link" href="Main Menu.html">&larr; Back to Main Menu</a>
  <h2>Settings</h2>

  <div class="section-title">Sales Invoice PDF Template</div>
  <div class="section-hint">Choose the layout used when generating Sales Invoice PDFs.</div>

  <div id="templateList" class="template-list">
    <div class="loading">Loading templates…</div>
  </div>

  <button id="saveBtn" onclick="saveTemplate()" disabled>Save</button>
  <span id="status"></span>
</div>

<script>
let templates = [];
let currentTemplate = null;
let selectedTemplate = null;

async function init() {
  const listEl = document.getElementById("templateList");

  try {
    const [templatesRes, settingsRes] = await Promise.all([
      fetch(API_BASE_URL + "/settings/invoice-templates").then(r => r.json()),
      fetch(API_BASE_URL + "/settings").then(r => r.json())
    ]);

    templates = templatesRes.templates || [];
    currentTemplate = settingsRes.invoice_template || (templates[0] && templates[0].id);
    selectedTemplate = currentTemplate;

    renderTemplates();
  } catch (err) {
    listEl.innerHTML = '<div class="error-msg">Could not load templates. Is the backend running?</div>';
    console.error(err);
  }
}

function renderTemplates() {
  const listEl = document.getElementById("templateList");
  listEl.innerHTML = "";

  templates.forEach(t => {
    const row = document.createElement("label");
    row.className = "template-option" + (t.id === selectedTemplate ? " selected" : "");
    row.innerHTML = `
      <input type="radio" name="template" value="${t.id}" ${t.id === selectedTemplate ? "checked" : ""}>
      <div>
        <div class="template-name">${t.name}${t.id === currentTemplate ? "  (current)" : ""}</div>
        <div class="template-desc">${t.description}</div>
      </div>
    `;
    row.querySelector("input").addEventListener("change", () => {
      selectedTemplate = t.id;
      renderTemplates();
    });
    listEl.appendChild(row);
  });

  document.getElementById("saveBtn").disabled = (selectedTemplate === currentTemplate);
}

async function saveTemplate() {
  const statusEl = document.getElementById("status");
  statusEl.textContent = "Saving…";
  statusEl.className = "";

  try {
    const res = await fetch(API_BASE_URL + "/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ invoice_template: selectedTemplate })
    });

    if (!res.ok) throw new Error("Save failed");

    currentTemplate = selectedTemplate;
    renderTemplates();
    statusEl.textContent = "Saved. New sales invoices will use this template.";
    statusEl.className = "ok";
  } catch (err) {
    statusEl.textContent = "Could not save settings.";
    statusEl.className = "err";
    console.error(err);
  }
}

init();
</script>

</body>
</html>
