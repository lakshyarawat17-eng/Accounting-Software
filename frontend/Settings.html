<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Settings</title>

<style>
body { font-family: "Times New Roman", serif; background:#fafafa; margin:0; }
.container { width: 640px; margin: 40px auto; background:#fff; padding:25px 30px; border:1px solid #000; }
h2 { margin-top: 0; }
.back-link { display:inline-block; margin-bottom: 18px; text-decoration:none; color:#333; }
.section-title { font-weight:bold; margin: 22px 0 4px 0; font-size: 15px; }
.section-hint { color:#555; font-size:13px; margin-bottom: 14px; }

.template-list { display:flex; flex-direction:column; gap:10px; }

.template-option {
  border: 1px solid #999;
  padding: 12px 14px;
  cursor: pointer;
  display:flex;
  gap: 12px;
  align-items:flex-start;
}
.template-option:hover { background:#f5f5f5; }
.template-option.selected { border-color:#000; background:#eef1fb; }

.template-option input[type="radio"] { margin-top: 4px; }
.template-name { font-weight:bold; font-size:14px; }
.template-desc { font-size:12.5px; color:#444; margin-top:2px; }

button#saveBtn {
  margin-top: 20px;
  padding: 8px 18px;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

#status { margin-left: 12px; font-size: 13px; }
#status.ok { color: #1a7a1a; }
#status.err { color: #b00000; }

.loading, .error-msg { font-size: 13px; color:#555; }
</style>
</head>

<body>

<div class="container">
  <a class="back-link" href="Main Menu.html">&larr; Back to Main Menu</a>
  <h2>Settings</h2>

  <div class="section-title">Sales Invoice PDF Template</div>
  <div class="section-hint">Choose the layout used when generating Sales Invoice PDFs.</div>

  <div id="templateList" class="template-list">
    <div class="loading">Loading templates…</div>
  </div>

  <button id="saveBtn" onclick="saveTemplate()" disabled>Save</button>
  <span id="status"></span>

  <div class="section-title" style="margin-top:32px;">Email (SMTP) Settings</div>
  <div class="section-hint">Used to send invoices to clients by email. For Gmail, use an <a href="https://myaccount.google.com/apppasswords" target="_blank">App Password</a>, not your normal password.</div>

  <label style="display:block; margin-top:10px; font-size:13px;">SMTP Host
    <input type="text" id="smtpHost" placeholder="smtp.gmail.com" style="width:100%; padding:6px; margin-top:3px; box-sizing:border-box;">
  </label>

  <div style="display:flex; gap:14px; margin-top:10px;">
    <label style="flex:1; font-size:13px;">Port
      <input type="number" id="smtpPort" placeholder="587" style="width:100%; padding:6px; margin-top:3px; box-sizing:border-box;">
    </label>
    <label style="flex:1; font-size:13px; display:flex; align-items:flex-end; gap:6px; padding-bottom:8px;">
      <input type="checkbox" id="smtpSecure" style="width:auto; margin:0;"> Use SSL (port 465)
    </label>
  </div>

  <label style="display:block; margin-top:10px; font-size:13px;">SMTP Username
    <input type="text" id="smtpUser" placeholder="you@yourdomain.com" style="width:100%; padding:6px; margin-top:3px; box-sizing:border-box;">
  </label>

  <label style="display:block; margin-top:10px; font-size:13px;">SMTP Password / App Password
    <input type="password" id="smtpPass" style="width:100%; padding:6px; margin-top:3px; box-sizing:border-box;">
  </label>

  <div style="display:flex; gap:14px; margin-top:10px;">
    <label style="flex:1; font-size:13px;">From Name
      <input type="text" id="smtpFromName" placeholder="Entity Name" style="width:100%; padding:6px; margin-top:3px; box-sizing:border-box;">
    </label>
    <label style="flex:1; font-size:13px;">From Email (optional, defaults to username)
      <input type="email" id="smtpFromEmail" style="width:100%; padding:6px; margin-top:3px; box-sizing:border-box;">
    </label>
  </div>

  <div style="margin-top:14px;">
    <button id="saveSmtpBtn" onclick="saveSmtp()">Save Email Settings</button>
    <span id="smtpStatus" style="margin-left:10px; font-size:13px;"></span>
  </div>

  <div style="margin-top:14px; display:flex; align-items:center; gap:8px;">
    <input type="email" id="testEmailTo" placeholder="send test email to…" style="flex:1; padding:6px; box-sizing:border-box;">
    <button onclick="sendTestEmail()">Send Test Email</button>
  </div>
  <div id="testEmailStatus" style="font-size:13px; margin-top:6px;"></div>
</div>

<script>
let templates = [];
let currentTemplate = null;
let selectedTemplate = null;

async function init() {
  const listEl = document.getElementById("templateList");

  try {
    const [templatesRes, settingsRes] = await Promise.all([
      fetch(API_BASE_URL + "/settings/invoice-templates").then(r => r.json()),
      fetch(API_BASE_URL + "/settings").then(r => r.json())
    ]);

    templates = templatesRes.templates || [];
    currentTemplate = settingsRes.invoice_template || (templates[0] && templates[0].id);
    selectedTemplate = currentTemplate;

    renderTemplates();
  } catch (err) {
    listEl.innerHTML = '<div class="error-msg">Could not load templates. Is the backend running?</div>';
    console.error(err);
  }
}

function renderTemplates() {
  const listEl = document.getElementById("templateList");
  listEl.innerHTML = "";

  templates.forEach(t => {
    const row = document.createElement("label");
    row.className = "template-option" + (t.id === selectedTemplate ? " selected" : "");
    row.innerHTML = `
      <input type="radio" name="template" value="${t.id}" ${t.id === selectedTemplate ? "checked" : ""}>
      <div>
        <div class="template-name">${t.name}${t.id === currentTemplate ? "  (current)" : ""}</div>
        <div class="template-desc">${t.description}</div>
      </div>
    `;
    row.querySelector("input").addEventListener("change", () => {
      selectedTemplate = t.id;
      renderTemplates();
    });
    listEl.appendChild(row);
  });

  document.getElementById("saveBtn").disabled = (selectedTemplate === currentTemplate);
}

async function saveTemplate() {
  const statusEl = document.getElementById("status");
  statusEl.textContent = "Saving…";
  statusEl.className = "";

  try {
    const res = await fetch(API_BASE_URL + "/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ invoice_template: selectedTemplate })
    });

    if (!res.ok) throw new Error("Save failed");

    currentTemplate = selectedTemplate;
    renderTemplates();
    statusEl.textContent = "Saved. New sales invoices will use this template.";
    statusEl.className = "ok";
  } catch (err) {
    statusEl.textContent = "Could not save settings.";
    statusEl.className = "err";
    console.error(err);
  }
}

init();

/* ---------------- SMTP SETTINGS ---------------- */
async function loadSmtpSettings() {
  try {
    const settings = await fetch(API_BASE_URL + "/settings").then(r => r.json());
    document.getElementById("smtpHost").value = settings.smtp_host || "";
    document.getElementById("smtpPort").value = settings.smtp_port || "";
    document.getElementById("smtpSecure").checked = settings.smtp_secure === "true";
    document.getElementById("smtpUser").value = settings.smtp_user || "";
    // Password intentionally left blank; only overwritten if the user types a new one.
    document.getElementById("smtpFromName").value = settings.smtp_from_name || "";
    document.getElementById("smtpFromEmail").value = settings.smtp_from_email || "";
  } catch (err) {
    console.error("Failed to load SMTP settings:", err);
  }
}

async function saveSmtp() {
  const statusEl = document.getElementById("smtpStatus");
  statusEl.textContent = "Saving…";
  statusEl.className = "";

  const payload = {
    smtp_host: document.getElementById("smtpHost").value.trim(),
    smtp_port: document.getElementById("smtpPort").value.trim(),
    smtp_secure: document.getElementById("smtpSecure").checked ? "true" : "false",
    smtp_user: document.getElementById("smtpUser").value.trim(),
    smtp_from_name: document.getElementById("smtpFromName").value.trim(),
    smtp_from_email: document.getElementById("smtpFromEmail").value.trim()
  };

  // Only send the password if the user actually typed one, so re-saving
  // other fields doesn't require re-entering it every time.
  const pass = document.getElementById("smtpPass").value;
  if (pass) payload.smtp_pass = pass;

  try {
    const res = await fetch(API_BASE_URL + "/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("Save failed");

    statusEl.textContent = "Email settings saved.";
    statusEl.className = "ok";
    document.getElementById("smtpPass").value = "";
  } catch (err) {
    statusEl.textContent = "Could not save email settings.";
    statusEl.className = "err";
    console.error(err);
  }
}

async function sendTestEmail() {
  const to = document.getElementById("testEmailTo").value.trim();
  const statusEl = document.getElementById("testEmailStatus");

  if (!to) {
    statusEl.textContent = "Enter an email address first.";
    statusEl.className = "err";
    return;
  }

  statusEl.textContent = "Sending…";
  statusEl.className = "";

  try {
    const res = await fetch(API_BASE_URL + "/settings/test-email", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to send");

    statusEl.textContent = "Test email sent. Check the inbox.";
    statusEl.className = "ok";
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = "err";
  }
}

loadSmtpSettings();
</script>

</body>
</html>
