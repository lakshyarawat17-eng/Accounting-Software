<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="auth.js"></script>
<title>Goods Receipt</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.back-link {
  display: inline-block;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

label {
  margin-right: 15px;
}

input, select {
  padding: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

.qty-input {
  width: 80px;
}

.batch-entry {
  min-width: 320px;
}

.batch-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 4px;
}

.batch-row input.qty-input {
  width: 60px;
}

.batch-row input.batch-no-input {
  width: 110px;
}

.batch-row input.expiry-input {
  width: 130px;
}

.remove-batch-btn {
  padding: 2px 6px;
  cursor: pointer;
}

.add-batch-btn {
  font-size: 12px;
  padding: 2px 6px;
  cursor: pointer;
}

.batch-col-labels {
  display: flex;
  gap: 4px;
  font-size: 11px;
  color: #666;
  margin-bottom: 2px;
}
.batch-col-labels span:nth-child(1) { width: 60px; }
.batch-col-labels span:nth-child(2) { width: 110px; }
.batch-col-labels span:nth-child(3) { width: 130px; }

.empty {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<a class="back-link" href="Purchase Order Register.html">⬅ Purchase Order Register</a>
<div class="title">Goods Receipt (GRN)</div>

<!-- PO PICKER (shown when no po_id in URL) -->
<div class="section-box" id="pickerBox" style="display:none;">
  <div class="section-title">Select Purchase Order</div>
  <select id="poPicker" style="width:400px;"></select>
  <button onclick="loadSelectedPO()">Load</button>
</div>

<!-- PO HEADER -->
<div class="section-box" id="headerBox" style="display:none;">
  <div class="section-title">Order Details</div>
  <label>PO No: <b id="poNoLabel"></b></label>
  <label>Supplier: <b id="supplierLabel"></b></label>
  <label>Order Date: <b id="poDateLabel"></b></label>
  <br><br>
  <label>Receipt Date:
    <input type="date" id="receiptDate">
  </label>
  <label>Receive Into:
    <select id="receiveLocation"></select>
  </label>
</div>

<!-- ITEMS -->
<div class="section-box" id="itemsBox" style="display:none;">
  <div class="section-title">Items Pending Receipt</div>

  <table id="itemsTable">
    <tr>
      <th>Item</th>
      <th>Ordered</th>
      <th>Already Received</th>
      <th>Pending</th>
      <th>Receive Now (Qty / Batch No / Expiry)</th>
    </tr>
  </table>

  <div style="margin-top:12px;">
    <button onclick="submitReceipt()">✅ Confirm Receipt</button>
  </div>
</div>

<div id="emptyMsg" class="empty" style="display:none;"></div>

<script>
let currentPO = null;

const params = new URLSearchParams(window.location.search);
const poIdFromUrl = params.get("po_id");

// Locations dropdown for the "receive into" location — mirrors the pattern
// in Item Wise Report.html. Defaults to "RM Store" to match the backend's
// own default (resolveLocationId fallback in /po/receive), so a GRN saved
// without ever touching the dropdown still lands in the same place it did
// before this control existed.
async function loadLocations() {
  const res = await fetch(API_BASE_URL + "/locations?active=1");
  const locations = await res.json();

  const select = document.getElementById("receiveLocation");
  select.innerHTML = locations.map(l => `<option value="${l.id}">${l.location_name}</option>`).join("");

  const rmStore = locations.find(l => l.location_name === "RM Store");
  if (rmStore) select.value = rmStore.id;
}

window.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("receiptDate").value = new Date().toISOString().slice(0, 10);
  await loadLocations();

  if (poIdFromUrl) {
    loadPO(poIdFromUrl);
  } else {
    await populatePicker();
  }
});

async function populatePicker() {
  const res = await fetch(API_BASE_URL + "/po/list");
  const list = await res.json();
  const receivable = list.filter(po => ["OPEN", "PARTIALLY_RECEIVED"].includes(po.status));

  if (!receivable.length) {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = "No purchase orders are pending receipt.";
    return;
  }

  const picker = document.getElementById("poPicker");
  picker.innerHTML = receivable
    .map(po => `<option value="${po.id}">${po.po_no} — ${po.supplier} (₹${po.grand_total.toFixed(2)})</option>`)
    .join("");

  document.getElementById("pickerBox").style.display = "block";
}

function loadSelectedPO() {
  const id = document.getElementById("poPicker").value;
  loadPO(id);
}

async function loadPO(id) {
  const res = await fetch(API_BASE_URL + `/po/${id}`);
  const po = await res.json();

  if (po.error) {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = po.error;
    return;
  }

  if (po.status === "CANCELLED") {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = "This purchase order has been cancelled.";
    return;
  }

  currentPO = po;

  document.getElementById("pickerBox").style.display = "none";
  document.getElementById("headerBox").style.display = "block";
  document.getElementById("itemsBox").style.display = "block";

  document.getElementById("poNoLabel").textContent = po.po_no;
  document.getElementById("supplierLabel").textContent = po.supplier;
  document.getElementById("poDateLabel").textContent = po.date;

  renderItems();
}

function renderItems() {
  const table = document.getElementById("itemsTable");
  table.innerHTML = `
    <tr>
      <th>Item</th>
      <th>Ordered</th>
      <th>Already Received</th>
      <th>Pending</th>
      <th>Receive Now (Qty / Batch No / Expiry)</th>
    </tr>
  `;

  currentPO.items.forEach(item => {
    const pending = item.qty - item.received_qty;
    const row = table.insertRow();
    row.innerHTML = `
      <td>${item.item_name}</td>
      <td class="center">${item.qty}</td>
      <td class="center">${item.received_qty}</td>
      <td class="center">${pending}</td>
      <td>
        ${pending > 0 ? `
          <div class="batch-entry" data-po-item-id="${item.id}" data-pending="${pending}">
            <div class="batch-col-labels"><span>Qty</span><span>Batch No</span><span>Expiry</span></div>
            <div class="batch-rows"></div>
            <button type="button" class="add-batch-btn" onclick="addBatchRow(this)">+ Add Batch</button>
          </div>
        ` : `<span class="center">—</span>`}
      </td>
    `;

    if (pending > 0) {
      const container = row.querySelector(".batch-entry");
      // First batch row defaults to the full pending qty, with an
      // auto-generated batch no the user can override — same "sensible
      // default, human overrides" spirit as resolveLocationId. Left blank
      // is also fine; batch_no is nullable end-to-end (Step 1/3).
      addBatchRow(container.querySelector(".add-batch-btn"), {
        qty: pending,
        batchNo: defaultBatchNo(item, 1)
      });
    }
  });
}

// Builds a sane default batch number so the field is never blank unless the
// user clears it — PO no (stripped of separators so it's a clean token) +
// the PO line item id (unique per line, so two lines on the same PO don't
// collide) + a running index for multiple batches received against the
// same line in this GRN.
function defaultBatchNo(item, index) {
  const poToken = (currentPO.po_no || "").replace(/[^A-Za-z0-9]/g, "");
  return `${poToken}-${item.id}-B${index}`;
}

// Adds a new batch sub-line (qty + batch no + expiry) to a line's batch
// entry. `btn` is the "+ Add Batch" button inside that line's container,
// used to find where to insert and to know which item this row belongs to.
// `defaults` optionally seeds the row (used for the first row on render).
function addBatchRow(btn, defaults) {
  const container = btn.closest(".batch-entry");
  const rowsDiv = container.querySelector(".batch-rows");

  const qty = defaults?.qty ?? "";
  const batchNo = defaults?.batchNo ?? "";

  const row = document.createElement("div");
  row.className = "batch-row";
  row.innerHTML = `
    <input type="number" class="qty-input" min="0" step="any" value="${qty}">
    <input type="text" class="batch-no-input" placeholder="Batch No" value="${batchNo}">
    <input type="date" class="expiry-input">
    <button type="button" class="remove-batch-btn" onclick="removeBatchRow(this)">✕</button>
  `;
  rowsDiv.appendChild(row);

  updateRemoveButtons(container);
}

// A line always needs at least one batch row, so the remove button is
// disabled when it's the only one left rather than allowing it down to zero.
function updateRemoveButtons(container) {
  const rows = container.querySelectorAll(".batch-row");
  rows.forEach(row => {
    row.querySelector(".remove-batch-btn").disabled = rows.length <= 1;
  });
}

function removeBatchRow(btn) {
  const container = btn.closest(".batch-entry");
  const row = btn.closest(".batch-row");
  const rows = container.querySelectorAll(".batch-row");
  if (rows.length <= 1) return;
  row.remove();
  updateRemoveButtons(container);
}

function submitReceipt() {
  const date = document.getElementById("receiptDate").value;
  if (!date) {
    alert("Receipt date required");
    return;
  }

  // Batch Tracking Step 4: each line's "Receive Now" cell is now one or
  // more batch sub-rows (qty + batch no + expiry) instead of a single qty
  // box, matching Step 3's { po_item_id, batches: [...] } payload shape.
  const containers = document.querySelectorAll("#itemsTable .batch-entry");
  const items = [];

  for (const container of containers) {
    const poItemId = Number(container.dataset.poItemId);
    const pending = Number(container.dataset.pending);
    const rows = container.querySelectorAll(".batch-row");

    const batches = [];
    let lineQty = 0;

    for (const row of rows) {
      const qty = Number(row.querySelector(".qty-input").value) || 0;
      if (qty <= 0) continue;

      const batchNo = row.querySelector(".batch-no-input").value.trim();
      const expiryDate = row.querySelector(".expiry-input").value || null;

      if (!batchNo) {
        alert("Enter a batch number for every quantity you're receiving");
        return;
      }

      batches.push({ batch_no: batchNo, expiry_date: expiryDate, qty });
      lineQty += qty;
    }

    if (lineQty <= 0) continue;

    if (lineQty > pending + 1e-6) {
      alert("Receive quantity cannot exceed the pending quantity");
      return;
    }

    items.push({ po_item_id: poItemId, batches });
  }

  if (!items.length) {
    alert("Enter at least one quantity to receive");
    return;
  }

  const locationId = document.getElementById("receiveLocation").value;

  fetch(API_BASE_URL + "/po/receive", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ po_id: currentPO.id, date, items, location_id: locationId || null })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }
    alert("Goods receipt recorded successfully");
    window.location.href = "Purchase Order Register.html";
  })
  .catch(() => alert("Error recording goods receipt"));
}
</script>

</body>
</html>
