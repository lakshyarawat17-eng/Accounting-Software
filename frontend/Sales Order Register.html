<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Sales Order Register</title>

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.back-link {
  display: inline-block;
  margin-bottom: 10px;
}

.top-actions {
  text-align: right;
  margin-bottom: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
  color: white;
}
.badge-OPEN { background: #888; }
.badge-PARTIALLY_DELIVERED { background: #d18f00; }
.badge-DELIVERED { background: #1a7f37; }
.badge-PARTIALLY_INVOICED { background: #b35c00; }
.badge-CLOSED { background: #0969da; }
.badge-CANCELLED { background: #c00; }

button {
  margin: 1px;
  cursor: pointer;
}

.empty {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<a class="back-link" href="Main Menu.html">⬅ Main Menu</a>
<div class="title">Sales Order Register</div>

<div class="top-actions">
  <a href="Sales Order.html"><button>➕ New Sales Order</button></a>
  <a href="Delivery Challan Register.html"><button>🚚 Delivery Challan Register</button></a>
</div>

<table id="soTable">
  <tr>
    <th>SO No</th>
    <th>Date</th>
    <th>Customer</th>
    <th>Status</th>
    <th>Qty (Delivered / Ordered)</th>
    <th>Grand Total</th>
    <th>Actions</th>
  </tr>
</table>
<div id="emptyMsg" class="empty" style="display:none;">No sales orders yet.</div>

<script>
const STATUS_LABELS = {
  OPEN: "Open",
  PARTIALLY_DELIVERED: "Partially Delivered",
  DELIVERED: "Delivered",
  PARTIALLY_INVOICED: "Partially Invoiced",
  CLOSED: "Closed",
  CANCELLED: "Cancelled"
};

async function loadSOs() {
  const res = await fetch(API_BASE_URL + "/so/list");
  const list = await res.json();

  const table = document.getElementById("soTable");
  const emptyMsg = document.getElementById("emptyMsg");

  table.innerHTML = `
    <tr>
      <th>SO No</th>
      <th>Date</th>
      <th>Customer</th>
      <th>Status</th>
      <th>Qty (Delivered / Ordered)</th>
      <th>Grand Total</th>
      <th>Actions</th>
    </tr>
  `;

  if (!list.length) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  list.forEach(so => {
    const row = table.insertRow();

    const canDeliver = ["OPEN", "PARTIALLY_DELIVERED"].includes(so.status);
    const canCancel = so.status === "OPEN" && so.total_delivered === 0 && so.total_invoiced === 0;
    const canInvoice = so.total_delivered > so.total_invoiced && so.status !== "CANCELLED";

    row.innerHTML = `
      <td>${so.so_no}</td>
      <td class="center">${so.date}</td>
      <td>${so.customer}</td>
      <td class="center"><span class="badge badge-${so.status}">${STATUS_LABELS[so.status] || so.status}</span></td>
      <td class="center">${so.total_delivered} / ${so.total_qty}</td>
      <td class="amount">₹${so.grand_total.toFixed(2)}</td>
      <td class="center">
        ${canDeliver ? `<button onclick="goDeliver(${so.id})">🚚 Create Delivery Challan</button>` : ""}
        ${canInvoice ? `<button onclick="goInvoice(${so.id})">🧾 Create Invoice</button>` : ""}
        ${canCancel ? `<button onclick="cancelSO(${so.id})">✕ Cancel</button>` : ""}
      </td>
    `;
  });
}

function goDeliver(id) {
  window.location.href = `Delivery Challan.html?so_id=${id}`;
}

function goInvoice(id) {
  window.location.href = `Sales Book.html?so_id=${id}`;
}

function cancelSO(id) {
  if (!confirm("Cancel this sales order?")) return;

  fetch(API_BASE_URL + `/so/${id}/cancel`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        alert(data.error);
        return;
      }
      loadSOs();
    })
    .catch(() => alert("Error cancelling sales order"));
}

loadSOs();
</script>

</body>
</html>
