<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="auth.js"></script>
<title>Journal Voucher</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.header {
  text-align: center;
  margin-bottom: 8px;
}

.header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: bold;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: bold;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th { text-align: center; }

.particulars { width: 50%; }
.lf { width: 10%; text-align: center; }
.debit, .credit { width: 20%; text-align: right; }

.narration {
  margin-top: 10px;
  font-style: italic;
}

.controls {
  margin-top: 12px;
  text-align: right;
}

button {
  padding: 6px 14px;
  font-size: 14px;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<div class="header">
  <h2>In the Books of "Entity Name"</h2>
</div>

<div class="top-bar">
  <div>
    Date :
    <input type="date" id="journalDate">
  </div>
</div>

<table>
<thead>
<tr>
  <th>Particulars</th>
  <th>L.F.</th>
  <th>Debit (₹)</th>
  <th>Credit (₹)</th>
</tr>
</thead>
<tbody id="journalBody"></tbody>
</table>

<div class="narration">
  Narration :
  <span id="narrationText" contenteditable="true"></span>
</div>

<div class="controls">
  <button id="saveBtn">Save Journal Entry</button>
</div>

<script>
const journalBody = document.getElementById("journalBody");
const dateInput = document.getElementById("journalDate");
const narrationText = document.getElementById("narrationText");
const saveBtn = document.getElementById("saveBtn");

let ledgerList = [];

/* -------- LOAD LEDGERS -------- */
function loadLedgers() {
  return fetch(API_BASE_URL + "/ledger/master")
    .then(res => res.json())
    .then(data => {
      console.log("Ledger API response:", data);
      ledgerList = data.map(l => l.ledger || l.name || l.ledger_name);
      populateLedgerDropdowns();
    });
}

/* -------- ENTER-KEY HANDLER -------- */
journalBody.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;

  const td = e.target;
  if (td.tagName !== "TD") return;

  e.preventDefault();

  const row = td.parentElement;
  const cells = [...row.children];
  const index = cells.indexOf(td);

  // Move to next cell
  if (index < cells.length - 1) {
    cells[index + 1].focus();
  } else {
    // Last cell → create new row
    addRow();
    journalBody.lastElementChild.children[0].querySelector("select").focus();
  }
});





/* -------- POPULATE DROPDOWNS -------- */
function populateLedgerDropdowns() {
  document.querySelectorAll(".particulars").forEach(sel => {
    const current = sel.value;
    sel.innerHTML = `<option value="">-- Select Ledger --</option>`;
    ledgerList.forEach(l => {
      const opt = document.createElement("option");
      opt.value = l;
      opt.textContent = l;
      sel.appendChild(opt);
    });
    sel.value = current;
  });
}

/* -------- ADD ROW -------- */
function addRow() {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><select class="particulars"></select></td>
    <td class="lf"></td>
    <td contenteditable="true" class="debit"></td>
    <td contenteditable="true" class="credit"></td>
  `;
  journalBody.appendChild(tr);
  populateLedgerDropdowns();
}

/* -------- CLEAR -------- */
function clearJournal() {
  journalBody.innerHTML = "";
  narrationText.textContent = "";
  addRow();
}

/* -------- TOTALS -------- */
function calculateTotals() {
  let debit = 0, credit = 0;
  [...journalBody.rows].forEach(r => {
    debit += Number(r.querySelector(".debit").textContent) || 0;
    credit += Number(r.querySelector(".credit").textContent) || 0;
  });
  return { debit, credit };
}

/* -------- SAVE -------- */
saveBtn.onclick = () => {
  if (!dateInput.value) return alert("Please select a date");

  const totals = calculateTotals();
  if (totals.debit !== totals.credit)
    return alert("Debit and Credit totals must match");

  const entries = [...journalBody.rows]
    .map(r => ({
      particulars: r.querySelector(".particulars").value,
      lf: r.querySelector(".lf").textContent.trim(),
      debit: r.querySelector(".debit").textContent.trim(),
      credit: r.querySelector(".credit").textContent.trim()
    }))
    .filter(e => e.particulars);

  if (!entries.length) return alert("At least one ledger entry required");

  fetch(API_BASE_URL + "/save-journal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      date: dateInput.value,
      narration: narrationText.textContent,
      entries
    })
  })
  .then(res => {
    if (!res.ok) return res.json().then(e => Promise.reject(e));
    return res.json();
  })
  .then(data => {
    alert("Journal Entry Saved");
    // L.F. already saved in DB – no need to update UI rows
    console.log("Saved Voucher:", data.voucher_no);

    clearJournal();
  })
  .catch(err => alert(err.error || "Error saving journal"));
};

/* -------- INIT -------- */
loadLedgers().then(clearJournal);
</script>

</body>
</html>
