
<!DOCTYPE html>
<html>
<head>
<script src="config.js"></script>
<style>
  body { font-family: Arial, sans-serif; font-size: 14px; margin: 20px; }
  label { display: inline-block; min-width: 110px; margin-top: 8px; }
  input, select { padding: 5px; margin-top: 8px; }
  .field-row { display: block; }
  .hint { color: #666; font-size: 12px; margin-left: 112px; }
  .error { color: #a60000; font-size: 12px; margin-left: 112px; display: none; }
  button { margin-top: 16px; padding: 6px 16px; }
  #missingHsnBox { margin-top: 24px; padding: 10px; border: 1px solid #a60000; display: none; }
  #missingHsnBox.show { display: block; }
  #missingHsnBox h3 { margin: 0 0 8px 0; color: #a60000; }
  #missingHsnBox li { margin-bottom: 4px; }
</style>
</head>
<body>
<h2>Item Master</h2>

<div class="field-row">
  <label>Item Code</label>
  <input id="item_code" placeholder="Item Code">
</div>

<div class="field-row">
  <label>Item Name</label>
  <input id="item_name" placeholder="Item Name" required>
</div>

<div class="field-row">
  <label>HSN/SAC *</label>
  <input id="hsn" placeholder="e.g. 847130" maxlength="8">
</div>
<div class="hint" id="hsnHint">Numeric code, 4/6/8 digits. Required length depends on your turnover slab (set in Settings).</div>
<div class="error" id="hsnError"></div>

<div class="field-row">
  <label>Unit (UQC) *</label>
  <select id="unit" required>
    <option value="">Select unit...</option>
  </select>
</div>
<div class="hint">Must be a standard GST Unit Quantity Code — free-text units get rejected in GSTR-1.</div>

<div class="field-row">
  <label>GST %</label>
  <input id="gst_rate" placeholder="GST %" type="number">
</div>

<div class="field-row">
  <label>Selling Price</label>
  <input id="selling_price" placeholder="Selling Price" type="number">
</div>

<div class="field-row">
  <label>Opening Qty</label>
  <input id="opening_qty" placeholder="Opening Qty" type="number">
</div>

<div class="field-row">
  <label>Opening Rate</label>
  <input id="opening_rate" placeholder="Opening Rate" type="number">
</div>

<button onclick="saveItem()">Save Item</button>

<div id="missingHsnBox">
  <h3>Items missing HSN/SAC</h3>
  <div>These existing items have no HSN code and won't be compliant for filing:</div>
  <ul id="missingHsnList"></ul>
</div>

<script>
const hsnInput = document.getElementById("hsn");
const hsnError = document.getElementById("hsnError");
const unitSelect = document.getElementById("unit");

// Populate the unit dropdown with the official UQC list from the backend
// instead of letting free text in.
fetch(API_BASE_URL + "/reference/uqc")
  .then(r => r.json())
  .then(d => {
    (d.uqc_codes || []).forEach(code => {
      const opt = document.createElement("option");
      opt.value = code;
      opt.textContent = code;
      unitSelect.appendChild(opt);
    });
  })
  .catch(() => {});

// Surface any existing items that are missing HSN so they can be fixed.
fetch(API_BASE_URL + "/items/missing-hsn")
  .then(r => r.json())
  .then(rows => {
    if (!Array.isArray(rows) || rows.length === 0) return;
    const box = document.getElementById("missingHsnBox");
    const list = document.getElementById("missingHsnList");
    rows.forEach(item => {
      const li = document.createElement("li");
      li.textContent = `${item.item_name} (${item.item_code || "no code"})`;
      list.appendChild(li);
    });
    box.classList.add("show");
  })
  .catch(() => {});

function clientSideHsnCheck(hsn) {
  const trimmed = (hsn || "").trim();
  if (!trimmed) return null; // required-ness is enforced server-side (depends on turnover)
  if (!/^\d{4}$|^\d{6}$|^\d{8}$/.test(trimmed)) {
    return "HSN/SAC must be numeric, 4, 6, or 8 digits.";
  }
  return null;
}

hsnInput.addEventListener("input", () => {
  const msg = clientSideHsnCheck(hsnInput.value);
  hsnError.style.display = msg ? "block" : "none";
  hsnError.textContent = msg || "";
});

function saveItem() {
  const localErr = clientSideHsnCheck(hsnInput.value);
  if (localErr) {
    hsnError.style.display = "block";
    hsnError.textContent = localErr;
    return;
  }
  if (!unitSelect.value) {
    alert("Please select a unit (UQC).");
    return;
  }

  fetch(API_BASE_URL + "/item/create", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      item_code: item_code.value,
      item_name: item_name.value,
      hsn: hsnInput.value,
      unit: unitSelect.value,
      gst_rate: Number(gst_rate.value),
      selling_price: Number(selling_price.value),
      opening_qty: Number(opening_qty.value),
      opening_rate: Number(opening_rate.value)
    })
  })
  .then(async r => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Error saving item");
    return d;
  })
  .then(() => {
    alert("Item saved");
    location.reload();
  })
  .catch(err => alert(err.message));
}
</script>
</body>
</html>
