<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

label {
  margin-right: 15px;
}

input {
  padding: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

/* 🔽 AUTOCOMPLETE DROPDOWN */
#suggestions {
  position: absolute;
  background: white;
  border: 1px solid #aaa;
  max-height: 150px;
  overflow-y: auto;
  z-index: 9999;
  width: 260px;
}

#suggestions div {
  padding: 6px;
  cursor: pointer;
}

#suggestions div:hover {
  background: #f0f0f0;
}

#clientSuggestions {
  position: absolute;
  background: white;
  border: 1px solid #aaa;
  max-height: 150px;
  overflow-y: auto;
  z-index: 9999;
  width: 260px;
  display: none;
}

#clientSuggestions div {
  padding: 6px;
  cursor: pointer;
}

#clientSuggestions div:hover {
  background: #f0f0f0;
}

#newClientForm label {
  display: block;
  margin-top: 6px;
}

#newClientForm input {
  width: 260px;
}

.totals-box {
  margin-top: 10px;
  text-align: right;
}
.totals-box div {
  margin: 2px 0;
}
.totals-box .grand {
  font-weight: bold;
  font-size: 15px;
}
</style>
  <link rel="stylesheet" href="ui-theme.css" />
</head>

<body>

<div class="title">Sales Book of "Entity Name"</div>

<div class="section-box" id="soBanner" style="display:none; background:#eef6ff;">
  📦 Invoicing against Sales Order <b id="soBannerNo"></b> — items below were pulled in from goods already delivered against it.
</div>

<!--1️⃣ INVOICE HEADER -->
<div class="section-box">
  <div class="section-title">Invoice Details</div>

  <label>Date:
    <input type="date" id="saleDate">
  </label>

  <label style="position:relative;">Customer:
    <input type="text" id="customer" placeholder="Search or type customer name" autocomplete="off">
    <div id="clientSuggestions"></div>
  </label>

  <label>Invoice No:
    <input type="text" id="invoiceNo" readonly>
  </label>

  <label>Sale Type:
    <select id="taxType">
      <option value="INTRA">Same State (CGST + SGST)</option>
      <option value="INTER">Different State (IGST)</option>
    </select>
  </label>
  <span id="taxTypeHint" style="font-size:11px; color:#555; margin-left:6px;"></span>

  <div id="clientInfoLine" style="margin-top:8px; font-size:12px; color:#555;"></div>

  <button type="button" id="newClientToggle" onclick="toggleNewClientForm()" style="margin-top:8px;">+ Add New Client</button>

  <div id="newClientForm" style="display:none; margin-top:10px; border:1px dashed #999; padding:10px;">
    <div class="section-title" style="text-decoration:none; margin-bottom:8px;">New Client Details</div>
    <label>Name: <input type="text" id="ncName"></label>
    <label>Email: <input type="email" id="ncEmail"></label>
    <label>Phone: <input type="text" id="ncPhone" placeholder="+91XXXXXXXXXX"></label>
    <label>Address: <input type="text" id="ncAddress"></label>
    <label>GSTIN: <input type="text" id="ncGstin"></label>
    <button type="button" onclick="saveNewClient()">Save Client</button>
    <span id="ncStatus" style="color:#a00; font-size:12px; margin-left:8px;"></span>
  </div>
</div>

<!-- 2️⃣ ADD ITEM -->
<div class="section-box" id="addItemBox">
  <div class="section-title">Add Item</div>

  <label>Description:
    <input type="text" id="itemSearch" placeholder="Search item">
    <div id="suggestions"></div>
  </label>

  <label>Qty:
    <input type="number" id="itemQty" value="1">
  </label>

  <label>Rate ₹:
    <input type="number" id="itemRate" step="0.01">
  </label>

  <label>GST Rate:
    <select id="itemGstRate">
      <option value="0">0%</option>
      <option value="0.25">0.25%</option>
      <option value="3">3%</option>
      <option value="5">5%</option>
      <option value="12">12%</option>
      <option value="18" selected>18%</option>
      <option value="28">28%</option>
    </select>
  </label>

  <label>Supply Type:
    <select id="itemSupplyType">
      <option value="TAXABLE" selected>Taxable</option>
      <option value="EXEMPT">Exempt</option>
      <option value="NIL_RATED">Nil Rated</option>
      <option value="ZERO_RATED">Zero Rated (Export/SEZ)</option>
    </select>
  </label>
  <span id="supplyTypeHint" style="font-size:11px; color:#555; margin-left:6px;"></span>

  <button onclick="addItem()">Add Item</button>
</div>

<!-- 3️⃣ ITEM LIST -->
<div class="section-box">
  <div class="section-title">Items</div>

  <table id="itemsTable">
    <tr>
      <th>Description</th>
      <th>Qty</th>
      <th>Rate</th>
      <th>Amount</th>
      <th>Supply Type</th>
      <th>GST %</th>
      <th>GST Amt</th>
      <th>Total</th>
    </tr>
  </table>

  <div class="totals-box" id="totalsBox"></div>
</div>

<!-- 4️⃣ SAVE -->
<div class="section-box">
  <button onclick="addSale()">Save Sales Invoice</button>

  <div id="sendEmailBox" style="display:none; margin-top:14px; padding-top:12px; border-top:1px dashed #999;">
    <div class="section-title" style="text-decoration:none;">Send Invoice</div>
    <span id="emailRecipientLine" style="font-size:13px;"></span><br>
    <input type="email" id="sendEmailOverride" placeholder="or enter an email to send to" style="width:260px; padding:5px; margin-top:6px;">
    <button type="button" onclick="sendInvoiceEmail()" style="margin-left:8px;">Send via Email</button>
    <div id="sendEmailStatus" style="font-size:13px; margin-top:6px;"></div>

    <div style="margin-top:12px; padding-top:10px; border-top:1px dotted #ccc;">
      <span id="whatsappRecipientLine" style="font-size:13px;"></span><br>
      <input type="text" id="sendWhatsappOverride" placeholder="or enter a phone number to send to" style="width:260px; padding:5px; margin-top:6px;">
      <button type="button" onclick="sendInvoiceWhatsapp()" style="margin-left:8px;">Send via WhatsApp</button>
      <div id="sendWhatsappStatus" style="font-size:13px; margin-top:6px;"></div>
    </div>

    <button type="button" onclick="location.reload()" style="margin-top:12px;">Start New Invoice</button>
  </div>
</div>

<script>
/* =====================
   GLOBAL STATE
===================== */
let items = [];
let selectedItem = null;
let selectedClientId = null; // null = free-typed customer name, no client record linked yet
let selectedClientPhone = null; // phone on file for the selected client, if any
let linkedSoId = null; // set when arriving from the Sales Order Register with ?so_id=
let companyGstin = null; // our own GSTIN, loaded from Settings, used only for the hint below

const searchInput = document.getElementById("itemSearch");
const suggestionsBox = document.getElementById("suggestions");
const itemGstRate = document.getElementById("itemGstRate");
const itemSupplyType = document.getElementById("itemSupplyType");
const supplyTypeHint = document.getElementById("supplyTypeHint");
const taxTypeSelect = document.getElementById("taxType");

const SUPPLY_TYPE_LABELS = {
  TAXABLE: null, // no label — normal GST breakup applies
  EXEMPT: "Exempt",
  NIL_RATED: "Nil Rated",
  ZERO_RATED: "Zero Rated"
};

let itemGstRateBeforeDisable = null;

// EXEMPT / NIL_RATED / ZERO_RATED lines always bill at 0% GST regardless of
// the item's normal gst_rate (mirrors the backend's forcing logic in
// /sales/save, Step 3) — so as soon as a non-taxable supply type is picked,
// lock the GST Rate field to 0% and grey it out, restoring whatever was
// there before if the user switches back to Taxable.
function applySupplyTypeToGstField() {
  const isTaxable = itemSupplyType.value === "TAXABLE";
  if (!isTaxable) {
    if (itemGstRateBeforeDisable === null) itemGstRateBeforeDisable = itemGstRate.value;
    itemGstRate.value = "0";
    itemGstRate.disabled = true;
    supplyTypeHint.textContent = "GST forced to 0% for this line.";
  } else {
    itemGstRate.disabled = false;
    if (itemGstRateBeforeDisable !== null) {
      itemGstRate.value = itemGstRateBeforeDisable;
      itemGstRateBeforeDisable = null;
    }
    supplyTypeHint.textContent = "";
  }
}

itemSupplyType.addEventListener("change", applySupplyTypeToGstField);

const customerInput = document.getElementById("customer");
const clientSuggestions = document.getElementById("clientSuggestions");
const clientInfoLine = document.getElementById("clientInfoLine");

const GSTIN_PATTERN = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;

// This is purely informational — the backend independently derives
// CGST+SGST vs IGST from the company's and the client's GSTIN state codes
// whenever both are on file, regardless of what the dropdown is set to.
// This just keeps the dropdown itself honest so what's shown matches what
// will actually be charged.
function updateTaxTypeHint(clientGstin) {
  const hint = document.getElementById("taxTypeHint");
  const g = (clientGstin || "").trim().toUpperCase();

  if (!companyGstin || !GSTIN_PATTERN.test(companyGstin) || !GSTIN_PATTERN.test(g)) {
    hint.textContent = "";
    return;
  }

  const isInter = g.slice(0, 2) !== companyGstin.slice(0, 2);
  taxTypeSelect.value = isInter ? "INTER" : "INTRA";
  hint.textContent = `Auto-detected from GSTIN: ${isInter ? "Inter-state (IGST)" : "Same state (CGST+SGST)"}`;
}

fetch(API_BASE_URL + "/settings")
  .then(res => res.json())
  .then(data => { companyGstin = (data.company_gstin || "").trim().toUpperCase(); })
  .catch(() => {});

/* =====================
   CLIENT AUTOCOMPLETE
===================== */
customerInput.addEventListener("input", async () => {
  selectedClientId = null;
  selectedClientPhone = null;
  clientInfoLine.textContent = "";
  clientSuggestions.innerHTML = "";
  clientSuggestions.style.display = "none";
  document.getElementById("taxTypeHint").textContent = "";

  const q = customerInput.value.trim();
  if (q.length < 1) return;

  try {
    const res = await fetch(API_BASE_URL + `/clients/search?q=${encodeURIComponent(q)}`);
    const list = await res.json();

    if (!list.length) return;

    list.forEach(client => {
      const div = document.createElement("div");
      div.textContent = client.email ? `${client.name} — ${client.email}` : client.name;
      div.onclick = () => {
        customerInput.value = client.name;
        selectedClientId = client.id;
        selectedClientPhone = client.phone || null;
        clientInfoLine.textContent =
          [client.email, client.phone].filter(Boolean).join(" | ") || "";
        updateTaxTypeHint(client.gstin);
        clientSuggestions.innerHTML = "";
        clientSuggestions.style.display = "none";
      };
      clientSuggestions.appendChild(div);
    });

    clientSuggestions.style.display = "block";
  } catch (err) {
    console.error("CLIENT SEARCH ERROR:", err);
  }
});

document.addEventListener("click", (e) => {
  if (e.target !== customerInput) clientSuggestions.style.display = "none";
});

/* =====================
   INLINE "ADD NEW CLIENT"
===================== */
function toggleNewClientForm() {
  const form = document.getElementById("newClientForm");
  const isHidden = form.style.display === "none";
  form.style.display = isHidden ? "block" : "none";
  if (isHidden) document.getElementById("ncName").value = customerInput.value;
}

async function saveNewClient() {
  const name = document.getElementById("ncName").value.trim();
  const email = document.getElementById("ncEmail").value.trim();
  const phone = document.getElementById("ncPhone").value.trim();
  const address = document.getElementById("ncAddress").value.trim();
  const gstin = document.getElementById("ncGstin").value.trim().toUpperCase();
  document.getElementById("ncGstin").value = gstin;
  const status = document.getElementById("ncStatus");

  if (!name) {
    status.textContent = "Name required";
    return;
  }

  const GSTIN_PATTERN = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;
  if (gstin && !GSTIN_PATTERN.test(gstin)) {
    status.textContent = "Invalid GSTIN format (e.g. 27ABCDE1234F1Z5). Leave blank if unregistered.";
    return;
  }

  try {
    const res = await fetch(API_BASE_URL + "/clients/create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, phone, address, gstin })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Failed to save client");

    // Auto-select the newly created client for this invoice
    customerInput.value = data.name;
    selectedClientId = data.id;
    selectedClientPhone = data.phone || null;
    clientInfoLine.textContent = [data.email, data.phone].filter(Boolean).join(" | ") || "";
    updateTaxTypeHint(data.gstin);

    status.textContent = "";
    document.getElementById("newClientForm").style.display = "none";
    ["ncName", "ncEmail", "ncPhone", "ncAddress", "ncGstin"].forEach(
      id => document.getElementById(id).value = ""
    );
  } catch (err) {
    console.error("CREATE CLIENT ERROR:", err);
    status.textContent = err.message;
  }
}

/* =====================
   LOAD INVOICE NUMBER
===================== */
function loadNextInvoice() {
  fetch(API_BASE_URL + "/sales/next-invoice")
    .then(res => res.json())
    .then(data => invoiceNo.value = data.invoiceNo)
    .catch(() => alert("Unable to load invoice number"));
}

/* If arriving from the Sales Order Register with ?so_id=, pull in the
   pending (delivered-but-not-yet-invoiced) items from that SO instead of
   starting blank. Otherwise behave exactly like a normal direct sale. */
window.addEventListener("DOMContentLoaded", async () => {
  loadNextInvoice();

  const params = new URLSearchParams(window.location.search);
  const soId = params.get("so_id");
  if (!soId) return;

  const res = await fetch(API_BASE_URL + `/so/${soId}`);
  const so = await res.json();
  if (so.error) {
    alert(so.error);
    return;
  }

  linkedSoId = so.id;

  document.getElementById("soBanner").style.display = "block";
  document.getElementById("soBannerNo").textContent = so.so_no;
  document.getElementById("addItemBox").style.display = "none";

  customerInput.value = so.customer;
  customerInput.readOnly = true;
  selectedClientId = so.client_id || null;
  taxTypeSelect.value = so.tax_type || "INTRA";
  taxTypeSelect.disabled = true;

  // Only items that have actually been DELIVERED (via Delivery Challan) and
  // not yet invoiced should be pulled in here. Using the ordered qty
  // instead of delivered_qty would let the customer be invoiced — and
  // booked as a debtor — for goods that haven't actually been dispatched.
  const pending = so.items.filter(i => i.delivered_qty - i.invoiced_qty > 1e-6);
  if (!pending.length) {
    alert("Nothing on this sales order is ready to invoice yet — either nothing has been delivered against it, or everything delivered has already been invoiced.");
  }

  pending.forEach(i => {
    const qty = i.delivered_qty - i.invoiced_qty;
    const amount = qty * i.rate;
    const gstAmount = amount * (i.gst_rate / 100);
    items.push({
      item_id: i.item_id,
      so_item_id: i.id,
      description: i.item_name,
      hsn: "",
      qty,
      rate: i.rate,
      amount,
      gst_rate: i.gst_rate,
      gst_amount: gstAmount,
      // Sales Orders don't carry a supply_type today (Step 1 only added it
      // to item_master / sales_invoice_items / credit_note_items), so
      // anything pulled in from a SO bills as ordinary Taxable — same as
      // its historical behaviour.
      supply_type: "TAXABLE"
    });
  });

  renderSoItems();
});

/* Renders items pulled in from a SO (read-only rows, no manual add/remove
   since the quantities must reconcile back to what was delivered). */
function renderSoItems() {
  itemsTable.innerHTML = `
    <tr>
      <th>Description</th>
      <th>Qty</th>
      <th>Rate</th>
      <th>Amount</th>
      <th>Supply Type</th>
      <th>GST %</th>
      <th>GST Amt</th>
      <th>Total</th>
    </tr>
  `;

  items.forEach(item => {
    const label = SUPPLY_TYPE_LABELS[item.supply_type] || null;
    const row = itemsTable.insertRow();
    row.innerHTML = `
      <td>${item.description}</td>
      <td class="center">${item.qty}</td>
      <td class="amount">${item.rate.toFixed(2)}</td>
      <td class="amount">${item.amount.toFixed(2)}</td>
      <td class="center">${label || "Taxable"}</td>
      <td class="center">${label ? "—" : item.gst_rate + "%"}</td>
      <td class="amount">${item.gst_amount.toFixed(2)}</td>
      <td class="amount">${(item.amount + item.gst_amount).toFixed(2)}</td>
    `;
  });

  renderTotals();
}

/* =====================
   AUTOCOMPLETE SEARCH
===================== */
searchInput.addEventListener("input", async () => {
  selectedItem = null;
  suggestionsBox.innerHTML = "";

  const q = searchInput.value.trim();
  if (q.length < 2) return;

  try {
    const res = await fetch(API_BASE_URL + `/items/search?q=${encodeURIComponent(q)}`);
    const list = await res.json();

    list.forEach(item => {
      const div = document.createElement("div");
      div.textContent = `${item.item_name} (₹${item.selling_price})`;

      div.onclick = () => {
        selectedItem = item;
        searchInput.value = item.item_name;
        itemRate.value = item.selling_price;

        // Prefill this line's Supply Type from the item's default
        // classification, then let applySupplyTypeToGstField() take care of
        // locking/unlocking the GST Rate field accordingly. Reset the
        // "before disable" cache first so a previous line's stale GST%
        // doesn't leak into this one.
        itemGstRateBeforeDisable = null;
        itemSupplyType.value = SUPPLY_TYPE_LABELS.hasOwnProperty((item.supply_type || "").toUpperCase())
          ? (item.supply_type || "TAXABLE").toUpperCase()
          : "TAXABLE";

        if (item.gst_rate !== null && item.gst_rate !== undefined) {
          const match = [...itemGstRate.options].find(
            o => Number(o.value) === Number(item.gst_rate)
          );
          if (match) itemGstRate.value = match.value;
        }

        applySupplyTypeToGstField();
        suggestionsBox.innerHTML = "";
      };

      suggestionsBox.appendChild(div);
    });
  } catch (err) {
    console.error(err);
  }
});

/* =====================
   STOCK CHECK
===================== */
async function getAvailableStock(itemId) {
  const res = await fetch(API_BASE_URL + `/stock/${itemId}`);
  const data = await res.json();
  return data.available;
}

/* =====================
   ADD ITEM
===================== */
async function addItem() {
  if (!selectedItem) {
    alert("Please select an item from dropdown");
    return;
  }

  const qty = Number(itemQty.value);
  const rate = Number(itemRate.value);

  if (qty <= 0 || rate <= 0) {
    alert("Invalid quantity or rate");
    return;
  }

  const available = await getAvailableStock(selectedItem.id);
  if (qty > available) {
    alert(`Insufficient stock\nAvailable: ${available}`);
    return;
  }

  const amount = qty * rate;
  const supplyType = itemSupplyType.value;
  // EXEMPT / NIL_RATED / ZERO_RATED always bill at 0% GST regardless of
  // whatever the GST Rate dropdown shows — mirrors the backend forcing in
  // /sales/save (Step 3), so the running totals and item list here match
  // exactly what gets saved and shown on the invoice PDF.
  const gstRate = supplyType === "TAXABLE" ? Number(itemGstRate.value) : 0;
  const gstAmount = amount * (gstRate / 100);
  const supplyTypeLabel = SUPPLY_TYPE_LABELS[supplyType];

  items.push({
    item_id: selectedItem.id,
    description: selectedItem.item_name,
    hsn: selectedItem.hsn || "",
    unit: selectedItem.unit || "",
    qty,
    rate,
    amount,
    gst_rate: gstRate,
    gst_amount: gstAmount,
    supply_type: supplyType
  });

  const row = itemsTable.insertRow();
  row.innerHTML = `
    <td>${selectedItem.item_name}</td>
    <td class="center">${qty}</td>
    <td class="amount">${rate.toFixed(2)}</td>
    <td class="amount">${amount.toFixed(2)}</td>
    <td class="center">${supplyTypeLabel || "Taxable"}</td>
    <td class="center">${supplyTypeLabel ? "—" : gstRate + "%"}</td>
    <td class="amount">${gstAmount.toFixed(2)}</td>
    <td class="amount">${(amount + gstAmount).toFixed(2)}</td>
  `;

  // RESET FOR NEXT ITEM
  selectedItem = null;
  searchInput.value = "";
  itemQty.value = 1;
  itemRate.value = "";
  itemGstRate.value = "18";
  itemGstRate.disabled = false;
  itemGstRateBeforeDisable = null;
  itemSupplyType.value = "TAXABLE";
  supplyTypeHint.textContent = "";

  renderTotals();
}

/* =====================
   RUNNING TOTALS (taxable / CGST / SGST / IGST / grand total)
===================== */
function renderTotals() {
  const totalsBox = document.getElementById("totalsBox");

  if (items.length === 0) {
    totalsBox.innerHTML = "";
    return;
  }

  const taxableItems = items.filter(i => i.supply_type === "TAXABLE" || !i.supply_type);
  const nonTaxableItems = items.filter(i => i.supply_type && i.supply_type !== "TAXABLE");

  const taxable = taxableItems.reduce((s, i) => s + i.amount, 0);
  const exemptNilValue = nonTaxableItems
    .filter(i => i.supply_type === "EXEMPT" || i.supply_type === "NIL_RATED")
    .reduce((s, i) => s + i.amount, 0);
  const zeroRatedValue = nonTaxableItems
    .filter(i => i.supply_type === "ZERO_RATED")
    .reduce((s, i) => s + i.amount, 0);

  const totalGst = items.reduce((s, i) => s + i.gst_amount, 0);
  const isInter = taxTypeSelect.value === "INTER";

  const igst = isInter ? totalGst : 0;
  const cgst = isInter ? 0 : totalGst / 2;
  const sgst = isInter ? 0 : totalGst / 2;
  const grandTotal = items.reduce((s, i) => s + i.amount, 0) + totalGst;

  totalsBox.innerHTML = `
    <div>Taxable Amount: ₹${taxable.toFixed(2)}</div>
    ${exemptNilValue > 0 ? `<div>Exempt / Nil Rated Amount: ₹${exemptNilValue.toFixed(2)}</div>` : ""}
    ${zeroRatedValue > 0 ? `<div>Zero Rated (Export/SEZ) Amount: ₹${zeroRatedValue.toFixed(2)}</div>` : ""}
    ${isInter
      ? `<div>IGST: ₹${igst.toFixed(2)}</div>`
      : `<div>CGST: ₹${cgst.toFixed(2)}</div><div>SGST: ₹${sgst.toFixed(2)}</div>`
    }
    <div class="grand">Grand Total: ₹${grandTotal.toFixed(2)}</div>
  `;
}

taxTypeSelect.addEventListener("change", renderTotals);

/* =====================
   SAVE SALE
===================== */
let lastSavedInvoiceNo = null;

function addSale() {
  if (!saleDate.value || !customer.value || items.length === 0) {
    alert("Complete invoice details first");
    return;
  }

  fetch(API_BASE_URL + "/sales/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      date: saleDate.value,
      customer: customer.value,
      clientId: selectedClientId,
      invoiceNo: invoiceNo.value,
      taxType: taxTypeSelect.value,
      so_id: linkedSoId,
      items
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }

    lastSavedInvoiceNo = invoiceNo.value;
    window.open(API_BASE_URL + data.pdf, "_blank");

    if (linkedSoId) {
      // This invoice was tied to a SO — head back to the register so the
      // user can see its updated status rather than showing the send-email
      // box for a form that's now done.
      window.location.href = "Sales Order Register.html";
      return;
    }

    showSendEmailBox();
  })
  .catch(() => alert("Error saving invoice"));
}

/* =====================
   SEND INVOICE EMAIL
===================== */
function showSendEmailBox() {
  const box = document.getElementById("sendEmailBox");
  const line = document.getElementById("emailRecipientLine");
  const waLine = document.getElementById("whatsappRecipientLine");

  box.style.display = "block";
  document.getElementById("sendEmailStatus").textContent = "";
  document.getElementById("sendEmailOverride").value = "";
  document.getElementById("sendWhatsappStatus").textContent = "";
  document.getElementById("sendWhatsappOverride").value = "";

  if (selectedClientId && clientInfoLine.textContent.includes("@")) {
    line.textContent = `Will send to ${customer.value} (${clientInfoLine.textContent.split("|")[0].trim()})`;
  } else {
    line.textContent = `No email on file for "${customer.value}" — enter one below to send.`;
  }

  if (selectedClientId && selectedClientPhone) {
    waLine.textContent = `Will WhatsApp to ${customer.value} (${selectedClientPhone})`;
  } else {
    waLine.textContent = `No phone on file for "${customer.value}" — enter one below to send.`;
  }
}

function sendInvoiceEmail() {
  const statusEl = document.getElementById("sendEmailStatus");
  const override = document.getElementById("sendEmailOverride").value.trim();

  if (!lastSavedInvoiceNo) {
    statusEl.textContent = "Save the invoice first.";
    return;
  }

  statusEl.textContent = "Sending…";

  fetch(API_BASE_URL + "/invoices/send-email", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      invoiceNo: lastSavedInvoiceNo,
      clientId: selectedClientId,
      email: override || undefined
    })
  })
  .then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to send");
    return data;
  })
  .then(data => {
    statusEl.textContent = `✅ Sent to ${data.sentTo}`;
  })
  .catch(err => {
    statusEl.textContent = `❌ ${err.message}`;
  });
}

/* =====================
   SEND INVOICE WHATSAPP
===================== */
function sendInvoiceWhatsapp() {
  const statusEl = document.getElementById("sendWhatsappStatus");
  const override = document.getElementById("sendWhatsappOverride").value.trim();

  if (!lastSavedInvoiceNo) {
    statusEl.textContent = "Save the invoice first.";
    return;
  }

  statusEl.textContent = "Sending…";

  fetch(API_BASE_URL + "/invoices/send-whatsapp", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      invoiceNo: lastSavedInvoiceNo,
      clientId: selectedClientId,
      phone: override || undefined
    })
  })
  .then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to send");
    return data;
  })
  .then(data => {
    statusEl.textContent = `✅ Sent to ${data.sentTo} via ${data.provider}`;
  })
  .catch(err => {
    statusEl.textContent = `❌ ${err.message}`;
  });
}
