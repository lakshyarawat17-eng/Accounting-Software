<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Books of Accounts – Main Menu</title>

<style>
@page {
  margin: 20mm;
}

body {
  font-family: "Times New Roman", serif;
  background-color: #f5f5f5;
  margin: 0;
  padding: 0;
}

/* Container */
.container {
  width: 800px;
  margin: 40px auto;
  background: white;
  border: 1px solid #000;
  padding: 30px;
}

/* Heading */
h1 {
  text-align: center;
  font-size: 24px;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  font-size: 16px;
  font-weight: normal;
  margin-bottom: 30px;
}

/* Menu Grid */
.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

/* Menu Cards */
.menu a {
  display: block;
  text-decoration: none;
  color: black;
  border: 1px solid black;
  padding: 20px;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  transition: background 0.2s, transform 0.2s;
}

.menu a:hover {
  background: #eaeaea;
  transform: translateY(-2px);
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Books of Accounts</h1>
  <h2>In the Books of "Entity Name"</h2>

  <div class="menu">

    <a href="Journal Register.html">🗑 Journal Register</a>

    <a href="GST Details.html">🧾 GST Details</a>
    <a href="Item Wise Report.html">📋 Item Wise Report</a>    
    <a href="Trial Balance.html">📊 Trial Balance</a>
    <a href="Profit and Loss.html">📈 Profit & Loss</a>
    <a href="Balance Sheet.html">📄 Balance Sheet</a>

  </div>


  <div class="footer">
    <p>Prepared for Accounting & Audit Purposes</p>
  </div>

</div>

</body>
</html>
