<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books of Accounts – Main Menu</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
  <script src="config.js"></script>
  <link rel="stylesheet" href="ui-theme.css" />
  <style>
    @page { margin: 14mm; }
    .app-shell {
      max-width: 1560px;
      margin: 22px auto 36px;
      padding: 0 22px 24px;
    }
    .hero {
      padding: 24px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 32px;
      letter-spacing: -0.03em;
      line-height: 1.12;
      max-width: 900px;
    }
    .hero .sub {
      max-width: 920px;
      font-size: 14px;
      line-height: 1.6;
    }
    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 280px;
      align-items: stretch;
    }
    .hero-actions .btn, .hero-actions a {
      width: 100%;
      justify-content: center;
    }
    .workspace {
      display: grid;
      grid-template-columns: 372px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .sidebar {
      padding: 16px;
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow: auto;
    }
    .sidebar-head {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }
    .sidebar-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .sidebar-title h2 {
      margin: 0 0 5px;
      font-size: 19px;
      letter-spacing: -0.01em;
    }
    .sidebar-title p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .search-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 14px 16px;
    }
    .search-wrap input {
      border: 0;
      padding: 0;
      background: transparent;
      font-size: 15px;
      outline: none;
    }
    #noResults {
      margin-bottom: 12px;
      text-align: center;
    }
    .module-nav {
      display: grid;
      gap: 6px;
    }
    .module-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text);
      cursor: pointer;
    }
    .module-nav-item:hover {
      background: #f4f7fc;
      border-color: var(--line);
    }
    .module-nav-item.active {
      background: var(--accent-soft);
      border-color: #c5d4ef;
      color: var(--accent-strong);
    }
    .module-nav-count {
      flex: 0 0 auto;
      min-width: 22px;
      text-align: center;
      border-radius: 999px;
      padding: 2px 7px;
      background: rgba(15, 23, 42, 0.06);
      color: var(--muted);
      font-weight: 700;
      font-size: 11px;
    }
    .module-nav-item.active .module-nav-count {
      background: rgba(28, 79, 156, 0.14);
      color: var(--accent-strong);
    }
    .link-grid {
      display: grid;
      gap: 10px;
    }
    .menu-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
    }
    .menu-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
      border-color: #c5d4ef;
      background: #ffffff;
    }
    .menu-link .text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .menu-link .title {
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      word-break: break-word;
    }
    .menu-link .href {
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }
    .menu-link .arrow {
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      flex: 0 0 auto;
    }
    .main-panel {
      display: grid;
      gap: 18px;
    }
    .summary-hero {
      padding: 22px 24px;
      display: grid;
      gap: 16px;
    }
    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }
    .summary-top h2 {
      margin: 0 0 7px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }
    .summary-top p {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }
    .summary-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .summary-actions .btn {
      min-width: 180px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .kpi {
      padding: 18px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.65);
      min-height: 108px;
    }
    .kpi .label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .kpi .value {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 8px;
      color: var(--text);
    }
    .kpi .note {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }
    .workspace-canvas {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 18px;
      align-items: stretch;
    }
    .canvas-card {
      min-height: 430px;
      padding: 22px;
      display: grid;
      gap: 16px;
    }
    .canvas-empty {
      display: grid;
      gap: 16px;
      align-content: start;
    }
    .canvas-empty h3 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .canvas-empty p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 640px;
      font-size: 14px;
    }
    .canvas-empty .hint-box {
      margin-top: 6px;
      padding: 16px 18px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.65;
      font-size: 13.5px;
    }
    .ghost-grid {
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .ghost-bar {
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e8eefc 0%, #dfe8f9 100%);
    }
    .ghost-bar.short { width: 52%; }
    .ghost-bar.mid { width: 72%; }
    .ghost-bar.long { width: 92%; }
    .mini-tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .mini-tile {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #ffffff;
    }
    .mini-tile .mini-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .mini-tile .mini-value {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 5px;
    }
    .mini-tile .mini-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }
    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
    }
    .hidden { display: none !important; }
    @media (max-width: 1200px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        max-height: none;
      }
      .workspace-canvas { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .app-shell { padding: 0 14px 18px; }
      .kpi-grid,
      .mini-tile-grid { grid-template-columns: 1fr; }
      .summary-actions .btn,
      .hero-actions .btn { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
<section class="hero">
      <div>
        <img src="assets/logo-lockup-compact.svg" alt="Books of Accounts" style="height:48px; width:auto; display:block;" />
      </div>
      <div class="hero-actions">
        <a class="btn primary" href="Dashboard.html">Open Executive Dashboard</a>
        <a class="btn secondary" href="Admin Tools.html">Open Admin Tools</a>
      </div>
    </section>

    <div class="workspace">
      <aside class="sidebar card">
        <div class="sidebar-head">
          <div class="sidebar-title">
            <div>
              <h2>Modules</h2>
              <p>Select a module to see its actions.</p>
            </div>
          </div>

          <div class="search-wrap card">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="flex:0 0 auto; color: var(--muted);">
              <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.5"/>
              <line x1="11" y1="11" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input id="menuSearch" type="text" placeholder="Search modules..." autocomplete="off" />
          </div>
        </div>

        <div id="noResults" class="status" style="display:none;">No matching modules found.</div>
        <nav class="module-nav" id="moduleNav" aria-label="Modules"></nav>
      </aside>

      <main class="main-panel" id="mainPanel"></main>
    </div>

    <div class="footer-note">Designed for fast daily work: accounting, inventory, compliance, payroll, and administration in one place.</div>
  </div>

  <script>
    const GROUPS = [{"id": "overview", "name": "Overview", "desc": "Quick access to the command centre and top-level analytics.", "links": [{"href": "Dashboard.html", "title": "Open Executive Dashboard"}, {"href": "Sales Purchase Analytics.html", "title": "Sales &amp; Purchase Analytics"}]}, {"id": "sales", "name": "Sales &amp; Collections", "desc": "Sales orders, invoices, notes, and customer-facing registers.", "links": [{"href": "Sales Order.html", "title": "Sales Order"}, {"href": "Delivery Challan.html", "title": "Delivery Challan"}, {"href": "Sales Book.html", "title": "Sales Invoice"}, {"href": "Credit Note.html", "title": "Credit Note"}, {"href": "Sales Order Register.html", "title": "Sales Order Register"}, {"href": "Delivery Challan Register.html", "title": "Delivery Challan Register"}, {"href": "Credit Note Register.html", "title": "Credit Note Register"}, {"href": "Clients.html", "title": "Clients"}]}, {"id": "purchase", "name": "Purchasing", "desc": "Procurement, receipts, notes, and vendor management.", "links": [{"href": "Purchase Order.html", "title": "Purchase Order"}, {"href": "Goods Receipt.html", "title": "Goods Receipt"}, {"href": "Purchase Book.html", "title": "Purchase Invoice"}, {"href": "Debit Note.html", "title": "Debit Note"}, {"href": "Purchase Order Register.html", "title": "Purchase Order Register"}, {"href": "Debit Note Register.html", "title": "Debit Note Register"}, {"href": "Suppliers.html", "title": "Suppliers"}]}, {"id": "inventory", "name": "Inventory", "desc": "Stock movement, item master, locations, and item-wise visibility.", "links": [{"href": "Stock Transfer.html", "title": "Stock Transfer"}, {"href": "Stock Transfer Register.html", "title": "Stock Transfer Register"}, {"href": "Item Master.html", "title": "Item Master"}, {"href": "Locations.html", "title": "Locations"}, {"href": "Item Wise Report.html", "title": "Item Wise Report"}]}, {"id": "manufacturing", "name": "Manufacturing", "desc": "BOMs, work orders, and production registers.", "links": [{"href": "Bill of Materials.html", "title": "Bill of Materials"}, {"href": "Work Order.html", "title": "Work Order"}, {"href": "BOM Register.html", "title": "BOM Register"}, {"href": "Work Order Register.html", "title": "Work Order Register"}]}, {"id": "assets", "name": "Assets", "desc": "Fixed assets, depreciation, and asset reporting.", "links": [{"href": "Assets.html", "title": "Asset Master"}, {"href": "Depreciation Run.html", "title": "Depreciation Run"}, {"href": "Asset Reports.html", "title": "Asset Reports"}]}, {"id": "accounts", "name": "Finance &amp; Books", "desc": "Cash, bank, journal, ledger, ageing, and trial balance.", "links": [{"href": "Cash Book.html", "title": "Cash / Bank Book"}, {"href": "Payment and Receipt.html", "title": "Payment / Receipt"}, {"href": "Outstanding and Ageing.html", "title": "Outstanding &amp; Ageing"}, {"href": "Journal.html", "title": "Journal Entry"}, {"href": "Journal Register.html", "title": "Journal Register"}, {"href": "Ledger Master.html", "title": "Ledger Master"}, {"href": "Ledger.html", "title": "Ledger"}, {"href": "Trial Balance.html", "title": "Trial Balance"}]}, {"id": "reports", "name": "Financial Reports", "desc": "Profitability and balance sheet views.", "links": [{"href": "Profit and Loss.html", "title": "Profit &amp; Loss"}, {"href": "Balance Sheet.html", "title": "Balance Sheet"}]}, {"id": "compliance", "name": "GST &amp; Compliance", "desc": "GST detail, HSN summaries, and statutory reporting.", "links": [{"href": "GST Details.html", "title": "GST Details"}, {"href": "HSN Summary.html", "title": "HSN Summary"}]}, {"id": "hr", "name": "Payroll &amp; HR", "desc": "Employees, payroll, attendance, salary structure, and loans.", "links": [{"href": "Employees.html", "title": "Employee Master"}, {"href": "Salary Structure.html", "title": "Salary Structure"}, {"href": "Attendance.html", "title": "Attendance"}, {"href": "Employee Loans.html", "title": "Loan / Advance"}, {"href": "Payroll Run.html", "title": "Payroll Run"}, {"href": "Payroll Reports.html", "title": "Payroll Reports"}, {"href": "Payroll Settings.html", "title": "Payroll Settings"}]}, {"id": "admin", "name": "System &amp; Admin", "desc": "Settings and admin utilities.", "links": [{"href": "Settings.html", "title": "Administration / Settings"}, {"href": "Admin Tools.html", "title": "Admin Tools"}]}];

    const search = document.getElementById('menuSearch');
    const noResults = document.getElementById('noResults');
    const moduleNav = document.getElementById('moduleNav');
    const mainPanel = document.getElementById('mainPanel');

    let selectedGroupId = null;

    function decodeEntities(str) {
      const el = document.createElement('textarea');
      el.innerHTML = str;
      return el.value;
    }

    function matchesQuery(group, q) {
      if (!q) return true;
      if (group.name.toLowerCase().includes(q)) return true;
      return group.links.some(l => l.title.toLowerCase().includes(q));
    }

    function renderNav() {
      const q = search.value.trim().toLowerCase();
      const visible = GROUPS.filter(g => matchesQuery(g, q));

      moduleNav.innerHTML = visible.map(g => `
        <button type="button" class="module-nav-item${g.id === selectedGroupId ? ' active' : ''}" data-group="${g.id}">
          <span class="module-nav-name">${decodeEntities(g.name)}</span>
          <span class="module-nav-count">${g.links.length}</span>
        </button>
      `).join('');

      noResults.style.display = visible.length ? 'none' : 'block';

      moduleNav.querySelectorAll('.module-nav-item').forEach(btn => {
        btn.addEventListener('click', () => selectGroup(btn.dataset.group));
      });

      // If the current selection got filtered out, fall back to overview.
      if (selectedGroupId && !visible.some(g => g.id === selectedGroupId)) {
        selectGroup(null);
      }
    }

    function renderOverview() {
      mainPanel.innerHTML = `
        <section class="summary-hero card">
          <div class="summary-top">
            <div>
              <span class="pill">Management view</span>
              <h2>Workspace summary</h2>
              <p>Pick a module on the left to see its actions here, or jump straight into a report below.</p>
            </div>
            <div class="summary-actions">
              <a class="btn secondary" href="Sales Purchase Analytics.html">Open Analytics</a>
              <a class="btn primary" href="Trial Balance.html">Trial Balance</a>
            </div>
          </div>
        </section>

        <section class="workspace-canvas">
          <div class="canvas-card card">
            <div class="canvas-empty">
              <h3>Quick actions</h3>
              <p>Jump straight into the transactions you'll reach for most.</p>
              <div class="hint-box" style="display:grid; gap:10px; border-style:solid;">
                <a class="btn secondary" href="Sales Order.html" style="justify-content:flex-start;">New Sales Order</a>
                <a class="btn secondary" href="Purchase Order.html" style="justify-content:flex-start;">New Purchase Order</a>
                <a class="btn secondary" href="Payment and Receipt.html" style="justify-content:flex-start;">Record Payment / Receipt</a>
                <a class="btn secondary" href="Journal.html" style="justify-content:flex-start;">New Journal Entry</a>
              </div>
            </div>
          </div>

          <div class="card" style="padding:22px; display:grid; gap:16px;">
            <div>
              <span class="pill">Where things live</span>
              <h3 style="margin:12px 0 8px; font-size:20px;">Four areas cover the whole business</h3>
              <div class="muted">Every module on the left falls into one of these groups.</div>
            </div>
            <div class="mini-tile-grid">
              <div class="mini-tile">
                <div class="mini-label">Daily work</div>
                <div class="mini-value">Sales, purchase, inventory</div>
                <div class="mini-desc">Most frequent transactional modules grouped together for quick launching.</div>
              </div>
              <div class="mini-tile">
                <div class="mini-label">Control</div>
                <div class="mini-value">Audit, GST, finance</div>
                <div class="mini-desc">The core bookkeeping and compliance modules stay easy to reach.</div>
              </div>
              <div class="mini-tile">
                <div class="mini-label">Operations</div>
                <div class="mini-value">Manufacturing &amp; payroll</div>
                <div class="mini-desc">Production and HR tools are kept visible without crowding the main view.</div>
              </div>
              <div class="mini-tile">
                <div class="mini-label">Admin</div>
                <div class="mini-value">Settings &amp; utilities</div>
                <div class="mini-desc">System tasks stay separated so the main workspace feels cleaner.</div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderGroupActions(group) {
      mainPanel.innerHTML = `
        <section class="summary-hero card">
          <div class="summary-top">
            <div>
              <span class="pill">Module</span>
              <h2>${decodeEntities(group.name)}</h2>
              <p>${decodeEntities(group.desc)}</p>
            </div>
            <div class="summary-actions">
              <button type="button" class="btn secondary" id="backToOverview">Back to overview</button>
            </div>
          </div>

          <div class="link-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));">
            ${group.links.map(l => `
              <a class="menu-link" href="${l.href}">
                <span class="text">
                  <span class="title">${decodeEntities(l.title)}</span>
                  <span class="href">${l.href}</span>
                </span>
                <span class="arrow">&rarr;</span>
              </a>
            `).join('')}
          </div>
        </section>
      `;

      document.getElementById('backToOverview').addEventListener('click', () => selectGroup(null));
    }

    function selectGroup(id) {
      selectedGroupId = id;
      const group = GROUPS.find(g => g.id === id);
      if (group) {
        renderGroupActions(group);
      } else {
        renderOverview();
      }
      renderNav();
    }

    search.addEventListener('input', renderNav);

    renderNav();
    selectGroup(null);
  </script>
</body>
</html>
